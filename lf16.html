<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LF 16 Prüfungsvorbereitung BRO 12</title>
<style>
:root{--bg:#f3f0e8;--ink:#2a2a27;--muted:#6b675d;--card:#fffdf8;--line:#ddd6c6;--acc:#d9611a;--acc2:#f2b33d;--ok:#2f7d3a;--okbg:#e3f1e2;--no:#b3261e;--nobg:#f8e1df}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.45}
header{background:var(--ink);color:#fff;padding:14px 16px 0}
header .top{display:flex;align-items:center;gap:12px;max-width:860px;margin:0 auto}
.stripe{width:38px;height:38px;flex:none;border-radius:6px;background:repeating-linear-gradient(45deg,var(--acc2) 0 7px,var(--ink) 7px 14px)}
header h1{font-size:19px;margin:0;font-weight:700}
header small{display:block;color:#cfc9bb;font-weight:400;font-size:14px}
nav{display:flex;gap:4px;max-width:860px;margin:12px auto 0;overflow-x:auto}
nav button{background:none;border:0;color:#d8d2c4;padding:10px 14px;font-size:16px;cursor:pointer;border-bottom:4px solid transparent;white-space:nowrap;font-family:inherit}
nav button.on{color:#fff;border-bottom-color:var(--acc)}
main{max-width:860px;margin:0 auto;padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select,input[type=text]{font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;font-family:inherit}
.btn{font-size:16px;padding:9px 16px;border-radius:6px;border:1px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.no{background:#fff;border-color:var(--no);color:var(--no)}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 2px 0 var(--line)}
.meta{font-size:14px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.q{font-weight:600;font-size:18px;margin:0 0 12px}
.card img{max-width:100%;max-height:260px;display:block;margin:6px auto 14px;border:1px solid var(--line);border-radius:6px;background:#fff}
.sol{border-left:5px solid var(--acc2);background:#fbf5e6;padding:10px 14px;margin-top:12px;border-radius:0 6px 6px 0}
.sol ul{margin:4px 0;padding-left:20px}.sol li{margin:3px 0}
.sol h4{margin:0 0 4px;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 14px}
.prog div{height:100%;background:var(--ok);transition:width .3s}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:16px;cursor:pointer;font-family:inherit;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:#fdf0e6}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.opt:disabled{cursor:default}
.opt .k{display:inline-block;width:24px;height:24px;line-height:22px;text-align:center;border:1px solid var(--muted);border-radius:50%;font-size:13px;margin-right:8px}
.fb{margin-top:10px;padding:10px 12px;border-radius:6px;font-weight:600}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.no{background:var(--nobg);color:var(--no)}
.score{font-size:15px;color:var(--muted)}
.big{font-size:40px;font-weight:700;color:var(--acc);margin:6px 0}
.hint{font-size:14px;color:var(--muted)}
.unit{font-weight:600;margin-left:4px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px}
@media(max-width:520px){body{font-size:16px}.q{font-size:17px}.card{padding:14px}}
</style>
</head>
<body>
<header>
 <div class="top"><div class="stripe"></div><div><h1>Lernfeld 16: Sanieren von Leitungen und Kanälen</h1><small>Prüfungsvorbereitung BRO 12</small></div></div>
 <nav>
  <button data-tab="train" class="on">30-Min-Training</button>
  <button data-tab="karten">Lernkarten</button>
  <button data-tab="mc">Ankreuzen</button>
  <button data-tab="bilder">Bilderquiz</button>
  <button data-tab="rechnen">Rechnen</button>
 </nav>
</header>
<main id="app"></main>
<footer>Tipp: Erst selbst überlegen oder aufschreiben, dann die Lösung aufdecken.</footer>
<script>
const THEMEN = [
  {id:"grund", name:"Grundlagen und Ablauf"},
  {id:"rein", name:"Reinigung"},
  {id:"insp", name:"Inspektion und Schäden"},
  {id:"san", name:"Sanierungsverfahren"},
  {id:"wg", name:"Wasser- und Gasleitungen"},
  {id:"proj", name:"Projekt Leitungssanierung"}
];

// Lernkarten: q = Frage, a = Lösung (Array = Aufzählung, String = Text)
const KARTEN = [
// ---------- Grundlagen ----------
{t:"grund", q:"Begründe die Notwendigkeit einer wiederkehrenden Überprüfung der Grundstücksentwässerung!",
 a:"Sie ist nötig, damit Schäden an Kanälen frühzeitig erkannt werden und austretendes Abwasser das Grundwasser und den Boden nicht kontaminieren (verseuchen) kann."},
{t:"grund", q:"Nenne die fünf Arbeitsschritte einer Sanierungsmaßnahme!",
 a:["Reinigung der Leitung/des Kanals","Inspektion/Bestandsaufnahme","Auswahl eines geeigneten Verfahrens","Sanierung der Leitung/des Kanals","Erfolgskontrolle/Prüfung"]},
{t:"grund", q:"Nenne und erläutere die drei Verfahren der Rohrsanierung!",
 a:["<b>Reparatur:</b> Behebung eines örtlich begrenzten Schadens","<b>Renovierung:</b> Innenbeschichtung/Auskleidung eines Rohrabschnitts bzw. einer Haltung unter Beibehaltung des Altrohrs","<b>Erneuerung:</b> Bau einer neuen Leitung unter Beibehaltung der alten Trasse (Lage)"]},
{t:"grund", q:"Nenne Beispiele für Reparatur, Renovierung und Erneuerung und gib die dazugehörigen Schadensbilder an!",
 a:["<b>Reparatur:</b> Roboterverfahren, Packerverfahren, Ausbesserung, Abdichtung, Injektion<br><i>Schadensbild:</i> einzelne Risse, undichte Muffe, fehlerhafte Einbindung, undichter Schachtanschluss, Fehlstellen in der Bettung",
    "<b>Renovierung:</b> Schlauchrelining, Kurzrohrrelining, Zementmörtelbeschichtung, Wickelrohrlining<br><i>Schadensbild:</i> Korrosion, Verschleiß der Innenflächen, häufige Risse und Undichtigkeiten, Reinigungsschäden",
    "<b>Erneuerung:</b> Berstlining, Pipe-Eating, Press-Zieh-Verfahren, Austausch in offener Bauweise<br><i>Schadensbild:</i> Lageabweichung oder Deformationen, Scherbenbildung oder Einsturz des Rohres"]},
{t:"grund", q:"Erkläre die Begriffe Reinigung, Inspektion, Reparatur, Renovierung und Erneuerung im Zusammenhang mit Arbeiten im Kanalbau!",
 a:["<b>Reinigung:</b> Maßnahmen zur Säuberung des Kanals","<b>Inspektion:</b> Maßnahmen zur Feststellung und Beurteilung des Istzustandes","<b>Reparatur:</b> Maßnahmen zur Wiederherstellung des Sollzustandes bei örtlich begrenzten Schäden","<b>Renovierung:</b> Maßnahmen zur Wiederherstellung des Sollzustandes schadhafter Kanäle durch deren technische Veränderung unter Erhaltung ihrer Substanz","<b>Erneuerung:</b> Herstellung neuer Kanäle durch Auswechselung (Substanzzerstörung) oder an anderer Stelle (Substanzaufgabe)"]},
{t:"grund", q:"Was versteht man unter Kanalsanierung?",
 a:"Alle Maßnahmen zur Wiederherstellung des Sollzustandes schadhafter Kanäle durch technische Veränderung unter Erhaltung ihrer Substanz. Der Unterschied zur Erneuerung: Der vorhandene Kanal bleibt erhalten und wird von innen mit neuen Materialien ausgekleidet."},
{t:"grund", q:"Nenne sechs Vorteile von grabenlosen Sanierungsverfahren!",
 a:["weniger Platzbedarf","kürzere Bauzeiten und geringere Kosten","kein Graben, nur Start-/Zielgrube, geringere Erdarbeiten","Altrohr verbleibt im Boden","geringe Beeinträchtigung von Fremdleitungen, da im vorhandenen Trassenquerschnitt gebaut wird","umweltfreundlicher, ökologischer Schutz (Baumschutzverordnung)","weniger Beeinträchtigung der Einwohner (Lärm, Geschäfte usw.)","unabhängiger von der Witterung","nur kurzzeitige Beeinflussung der Versorgung bzw. Entsorgung, keine Zusatzleitung nötig","weniger Unfallgefahr am offenen Graben","weniger Beeinflussung von Verkehrsflächen, Zufahrten bleiben erhalten","<i>(sechs davon reichen)</i>"]},
{t:"grund", q:"Welche Fehler beim Bau von Rohrleitungen und Kanälen können dazu führen, dass die Rohrverbindungen undicht sind oder werden?",
 a:["unsachgemäßer Umgang mit den Rohren","falsch oder nicht eingebaute Dichtungen","Verschmutzungen im Muffenraum","fehlende Gleitmittel","nicht zentrierter Zusammenbau","Nichteinhaltung der Einschubtiefen","fehlerhafte Verdichtung (Rissbildung)","nicht gelenkige Schachtanschlüsse"]},

// ---------- Reinigung ----------
{t:"rein", q:"Wann und zu welchem Zweck werden Reinigungsarbeiten an Kanälen durchgeführt?",
 a:["in regelmäßigen Abständen","Beseitigung von Ablagerungen","Vermeidung von Geruchsbelästigungen","Reduzierung von Korrosion durch biogene Schwefelsäure","Vorbereitung von Inspektions- und Sanierungsarbeiten"]},
{t:"rein", q:"Wann und zu welchem Zweck werden Reinigungsarbeiten an Druckrohrleitungen durchgeführt?",
 a:["situationsbezogen im Zuge von Reparatur- oder Wartungsmaßnahmen","Beseitigung von Inkrustationen","Vorbereitung von Sanierungsarbeiten"]},
{t:"rein", q:"Beschreibe die Reinigung einer Druckrohrleitung mittels Molchen!",
 a:"Reinigungskörper werden in den Rohrquerschnitt gegeben und nach dem Verschließen der Leitung mittels Betriebsdruck mit dem Medium durch die Rohrleitung getrieben. Der Molch löst die Inkrustationen und schiebt sie vor sich her bis zur Entnahme an der Endstelle."},
{t:"rein", q:"Was bedeutet der Begriff „Molchbarkeit“?",
 a:"Die Eignung einer Rohrleitung zur Befahrung mit Molchen. Dazu muss der Rohrquerschnitt auf der gesamten Leitungsstrecke in derselben Dimension kreisrund sein. Nicht alle Armaturen ermöglichen das Molchen, auch Reduzierungen und Aufweitungen sind nicht molchbar."},
{t:"rein", q:"Welche Armaturen sind molchbar, welche nicht?",
 a:["<b>molchbar:</b> Kugelhahn, Schieber, Kegelhahn","<b>nicht molchbar:</b> Ventil, Klappe"]},
{t:"rein", q:"Welches Kanalreinigungsverfahren ist hier skizziert?", img:"spuelkugel",
 a:"Kanalreinigung mit Spülkugel"},
{t:"rein", q:"Erläutere den Unterschied zwischen einer Stauspülung und einer Hochdruckspülung! Wann kann das jeweilige Verfahren eingesetzt werden?",
 a:["<b>Stauspülung:</b> Der Spülkörper wird am oberen Ende der Leitungsstrecke in die Leitung gegeben, das Wasser staut sich dahinter auf und schiebt den Spülkörper durch die Leitung. Geeignet bei geringen und losen Verschmutzungen, bei ausreichendem Gefälle und bei Abschnitten ohne Nebenleitungen.",
    "<b>Hochdruckspülung:</b> Ein mit Düsen besetzter Spülkopf wird am unteren Ende in den Leitungsabschnitt eingebracht, löst die Ablagerungen mittels Wasserstrahl und spült sie in Richtung Startschacht. Geeignet bei losen und festen Ablagerungen und bei allen Rohrdimensionen bis DN 2500."]},
{t:"rein", q:"Welche Funktionen erfüllen die verschiedenen Düsen am Spülkopf während der Hochdruckspülung?",
 a:["<b>axial nach vorn gerichtete Düsen:</b> lösen Ablagerungen und Verstopfungen im Rohrquerschnitt","<b>radiale, zum Teil rotierende Düsen:</b> stützen sich auf der Rohrwandung ab, halten den Spülkopf in der Mitte und lösen seitliche Ablagerungen","<b>schräg nach hinten gerichtete Düsen:</b> bewegen den Spülkopf nach vorn; zum Teil schwenkbar, damit lässt sich die Vortriebsgeschwindigkeit steuern"]},
{t:"rein", q:"Darf das Restwasser bei Spülungen in den nächsten Kanalabschnitt eingeleitet werden? Begründe!",
 a:"Nein. Das Restwasser muss mit Pumpen abgesaugt und entsorgt werden, damit es den nächst tiefer liegenden Leitungsabschnitt nicht verunreinigt oder sogar verstopft."},
{t:"rein", q:"Welches Spülverfahren beginnt am unteren und welches am oberen Ende eines Leitungsabschnittes? Begründe!",
 a:["<b>Stauspülung:</b> beginnt am oberen Ende, weil der Spülkörper durch das Gefälle und den Staudruck des nachfolgenden Wassers vorangetrieben wird.","<b>Hochdruckspülung:</b> beginnt am unteren Ende, damit das gelöste Gut am Spülkopf vorbei wegläuft und die Leitung vor dem Spülkopf nicht verstopft."]},
{t:"rein", q:"In welchen Situationen werden mechanische Reinigungsverfahren angewandt?",
 a:["nur wenn die Spülung ohne Erfolg bleibt","bei umfangreichen Ablagerungen mit geringem Restquerschnitt des Rohres","bei stark verfestigten Ablagerungen"]},
{t:"rein", q:"Eine Wasserleitung ist auf der gesamten Innenoberfläche stark rostig. Dein Unternehmen hat sich für eine mechanische Reinigung entschieden. Welche Geräte würdest du einsetzen? Begründe!",
 a:"Stahlfedermolch zum Lösen des Rostes und Gummischeibenzug, um die gelösten Bestandteile aus dem Rohrquerschnitt zu befördern."},
{t:"rein", q:"Wie ist mit kreuzenden Leitungen im Kanalquerschnitt zu verfahren?",
 a:["alle infrage kommenden Versorgungsunternehmen informieren","Beseitigung erst, nachdem die Leitung durch das entsprechende Unternehmen außer Betrieb genommen wurde"]},

// ---------- Inspektion und Schäden ----------
{t:"insp", q:"Welches Prinzip der Überwachung von Rohrleitungen ist hier skizziert? Wann wird es überwiegend eingesetzt?", img:"kanalspiegelung",
 a:"Das Prinzip der Kanalspiegelung. Es wird häufig bei nicht begehbaren und kleineren Kanälen angewendet. Man erkennt Ablagerungen und defekte oder fehlerhafte Seitenanschlüsse."},
{t:"insp", q:"Welches Prinzip der Überwachung von Rohrleitungen ist hier skizziert?", img:"kamera_seil",
 a:"Innenprüfung mittels Kamera, die selbst fahrend oder (wie hier) mit Seilen auch durch kleinere Rohrleitungen fahren kann (DN 80 bis DN 150)."},
{t:"insp", q:"Erläutere den Unterschied zwischen der direkten und der indirekten optischen Inspektion!",
 a:["<b>direkt:</b> Begehung des Rohrquerschnittes ab einer Nennweite von DN 1200 und exakte Vermessung der Schäden","<b>indirekt:</b> Feststellung der Schäden durch Spiegelung oder Einsatz von Kamerasystemen"]},
{t:"insp", q:"Beschreibe die Kanalspiegelung!",
 a:"In einem Schacht wird ein um 45° geneigter Spiegel eingesetzt, im anderen Schacht eine Lampe zur Ausleuchtung des Rohrquerschnittes. Die Lampe darf nur eine geringe Wärmeabstrahlung haben, weil wegen der Faulgase explosive Gasgemische im Kanal nicht ausgeschlossen werden können. Die Schäden werden haltungsweise dokumentiert."},
{t:"insp", q:"Welche Schäden kann man durch die Kanalspiegelung erkennen, welche nicht?",
 a:["<b>erkennbar:</b> Lageabweichungen, Wurzeleinwachsungen, Ablagerungen, Einstürze","<b>nicht erkennbar:</b> Muffenspalt, undichte Verbindungen, Risse in Rohren, Deformationen, Korrosion, Verschleiß der Oberflächen"]},
{t:"insp", q:"Nenne Sicherheitsvorkehrungen, die bei der direkten optischen Inspektion von Leitungen und Kanälen unbedingt einzuhalten sind!",
 a:["nicht in den Kanal steigen ohne Sicherungsperson außen","Messung der Faulgaskonzentration, ggf. Reduzierung durch vorherige Spülung"]},
{t:"insp", q:"Welche fahrenden und welche nicht fahrenden Transportgeräte werden bei TV-Untersuchungen eingesetzt?",
 a:["<b>fahrend:</b> Radfahrwerk, Raupenfahrwerk, HD-Spülkopf","<b>nicht fahrend:</b> Kufenschlitten, Ponton, Glasfaserstangen"]},
{t:"insp", q:"Was ist ein Inklinometer?",
 a:"Ein Inklinometer gibt die Neigung (das Gefälle) des Rohres mit einer Genauigkeit von 0,1° an."},
{t:"insp", q:"Erläutere die Begriffe Infiltration und Exfiltration! Warum kommen Infiltrationen bei Druckrohrleitungen nicht vor?",
 a:["<b>Infiltration:</b> Einsickerung bzw. Einlagerung von Flüssigkeiten oder Bodenteilchen","<b>Exfiltration:</b> Heraussickerung von Flüssigkeiten","Bei Druckrohrleitungen ist der Innendruck wesentlich höher als der Druck des umgebenden Grundwassers, deshalb ist eine Infiltration ausgeschlossen."]},
{t:"insp", q:"Durch welche Einwirkungen entstehen in Leitungen und Kanälen Verschleißschäden?",
 a:["Abrieb","Reinigung mit Hochdruckgeräten oder mechanischen Geräten","Strömung des Mediums","Aufprall von Wasser/Abwasser"]},
{t:"insp", q:"Bei welchen Leitungsnetzen ist mit Strömungsschäden und wo mit Abriebschäden zu rechnen?",
 a:["<b>Strömungsschäden:</b> besonders bei Druckrohrleitungen in Abwinkelungen, Krümmern, Abzweigen und an Steilstrecken","<b>Abriebschäden:</b> besonders in Abwasserkanälen an den Rohrsohlen, durch den Transport von Streusand, Splitt, Scherben und anderen Feststoffen"]},
{t:"insp", q:"Nenne typische Schadensbilder bei Verformungen und Zerstörungen von Leitungen!",
 a:["Deformationen","Rissbildung","Lageabweichungen","Leckstellen/Scherbenbildung","Einsturz"]},
{t:"insp", q:"Welcher Rohrschaden kann zu plötzlichen Fahrbahneinbrüchen führen? Beschreibe die Entstehung!",
 a:"Durch Infiltrationen an Leckstellen und undichten Verbindungen werden Grundwasser und Bodenbestandteile der Rohrbettung in das Rohr gespült. Mit der Zeit entstehen um das Rohr große Hohlräume, die zum Einbruch der darüber liegenden Fahrbahn führen können."},
{t:"insp", q:"Raue Innenoberflächen sind häufig der Ausgangspunkt für Ablagerungen. Wodurch werden Innenoberflächen rau?",
 a:["mechanischer Verschleiß durch Abrieb, Aufprall, Strömung oder Reinigungsarbeiten","Korrosion der Innenoberflächen"]},
{t:"insp", q:"Welcher Schaden liegt hier vor? Wann kommt es zu solchen Schäden?", img:"sb_laengsriss",
 a:"Längsrisse. Sie entstehen durch Fehler in der seitlichen Rohrbettung."},

// ---------- Sanierungsverfahren ----------
{t:"san", q:"Das Kurzrohr-Relining eignet sich besonders für kurze Strecken. Nenne die wichtigsten Arbeitsschritte (8 Schritte)!", img:"kurzrohr_skizze",
 a:["Baustelle sichern und Kanal außer Betrieb nehmen","Reinigung der Sanierungsstrecke","Abdichtung mit Spezialmörtel und Beseitigung von Abflusshindernissen","Einziehen der Inliner-Rohre","Einziehen der Rohre mittels Greifzug im Startschacht","Verfüllen des Ringleerraumes","Wiederherstellung der Anschlüsse","Prüfung der sanierten Strecken"]},
{t:"san", q:"Welche Renovierungsverfahren werden in nicht begehbaren Kanälen (< DN 800) durchgeführt?",
 a:["Schlauchreliningverfahren","Rohrreliningverfahren","Wickelrohrverfahren"]},
{t:"san", q:"Erkläre Schlauchrelining, Rohrrelining und Wickelrohrverfahren genauer!",
 a:["<b>Schlauchrelining:</b> Eine oder mehrere Haltungen bekommen eine neue Innenhaut aus Nadelfilzschläuchen und Harz. Zwei Verfahren: Einziehverfahren bzw. Inversionsverfahren.","<b>Rohrrelining:</b> Im Gegensatz zum Schlauchrelining werden fertige Rohre eingesetzt. Arten: Verformungsverfahren, Langrohrrelining, Kurzrohrrelining.","<b>Wickelrohrverfahren:</b> Aus einem schmalen PVC-Profil wird ein Rohr gewickelt. Es liegt nicht eng am Altrohr an, der Zwischenraum muss mit tragfähigem Material (Dämmer) ausgefüllt werden."]},
{t:"san", q:"Nenne die Vor- und Nachteile des Langrohr- und Kurzrohrrelinings!",
 a:["<b>Vorteile:</b> Inliner übernimmt die statische Tragfähigkeit; hell eingefärbte Materialien verbessern die Sichtkontrolle bei der Inspektion; beim Kurzrohrverfahren keine Baugruben nötig; beim Kurzrohrverfahren können präparierte Rohre für die Einbindung der Anschlusskanäle eingefahren werden; PE-HD ist gut chemikalienbeständig und langzeitbeständig",
    "<b>Nachteile:</b> erhebliche Querschnittsreduzierung bei beiden Verfahren; beim Langrohrverfahren erhöhter Platzbedarf durch Einziehbaugrube; Einbindung der Seitenzuläufe ist bei beiden aufwendig; große Anzahl von Rohrverbindungen beim Kurzrohrverfahren"]},
{t:"san", q:"Mit welchen Werkzeugen lässt sich ein Kanalroboter ausrüsten?",
 a:["Fräsköpfe (radial und axial beweglich)","Bohrer","Spachtel","Schalungselemente","Dichtblasen usw."]},
{t:"san", q:"Nenne die Arbeitsschritte bei der Ausbesserung von Schadstellen in Leitungen und Kanälen!",
 a:["gelockerte Oberflächen und Scherben entnehmen","einragende Gegenstände abschneiden/abfräsen","Fugen und Risse ausarbeiten","Ersatzmaterial in Fugen, Löcher oder Risse einbringen","Oberflächen bearbeiten und glätten"]},
{t:"san", q:"Welche Schadensbilder lassen sich mit dem Ausbesserungs-, dem Abdichtungs- und dem Injektionsverfahren reparieren?",
 a:["<b>Ausbesserung:</b> Risse, Wurzeleinwachsungen, fehlerhafte Anschlüsse","<b>Abdichtung:</b> Versätze, Radialrisse, kurze Längsrisse, Punktrisse/Scherbenbildung","<b>Injektion:</b> undichte Verbindungen, fehlende Wandungsteile, Risse, Hohlraumbildung außerhalb des Rohres durch Infiltration"]},
{t:"san", q:"Nenne Schäden, bei denen Erneuerungsverfahren eingesetzt werden können!",
 a:["Einbrüche/Einsturz","Lageabweichungen","Versätze","Deformationen"]},
{t:"san", q:"Welche grabenlosen Erneuerungsverfahren sind im alten Trassenverlauf und welche in einer neuen Trasse einsetzbar?",
 a:["<b>alte Trasse:</b> statisches Berstlining, dynamisches Berstlining, Press-Zieh-Verfahren","<b>neue Trasse:</b> Pressverfahren, Bohrverfahren, Bodenverdrängungsverfahren"]},
{t:"san", q:"Beschreibe stichwortartig das Sanierungsverfahren Berstlining!",
 a:["Herstellung der Start- und Zielgrube","Verdrängungskörper wird mittels Hydraulikanlage in das Altrohr gepresst und durch die vorhandene Leitung gezogen","Altrohr wird zerstört","Materialreste werden in den Boden verdrängt","neues Rohr wird eingezogen"]},
{t:"san", q:"Nenne vier Vorteile des Berstlining-Verfahrens!",
 a:["umweltschonend","bürgerfreundlich","verkehrsgerecht","kurze Bauzeit","geringe Kosten"]},
{t:"san", q:"Beschreibe den Arbeitsablauf beim dynamischen Berstlining! Welche Nebenwirkungen können im Umfeld auftreten?",
 a:"Berstmaschinen bewegen sich ähnlich wie Erdraketen mit schneller Schlagzahl axial im Rohr. Ein konischer Berstkopf (je nach Rohrmaterial mit Schlagmessern) zertrümmert das Altrohr und presst die Scherben seitlich in den Boden. Die Vorschubkraft wird durch eine Seilwinde oder eine Hydraulikstation mit Zuggestänge in der Zielgrube erhöht.<br><b>Nebenwirkungen:</b> Die Schläge werden als Schwingungen im Boden weitergetragen. Hohlräume können sich verdichten, dadurch kann es zu Setzungen von Straßen, Rohrauflagern und Gebäuden kommen."},
{t:"san", q:"Unterscheide die Arten des Berstlinings und nenne jeweils Vor- und Nachteile!",
 a:["<b>dynamisches Berstlining</b><br>Vorteile: Altrohr bleibt im Boden, keine Reduzierung des Rohrquerschnitts, geringe Zugkräfte erforderlich<br>Nachteil: Vibration im Boden kann zu Setzungen im Umfeld führen",
    "<b>statisches Berstlining</b><br>Vorteile: Altrohr bleibt im Boden, keine Reduzierung des Rohrquerschnitts, keine Setzungen durch Vibration<br>Nachteil: Die Hydraulikstation muss sehr hohe Zugkräfte aufbringen"]},
{t:"san", q:"Bei welchen Altrohrmaterialien lässt sich das Berstverfahren einsetzen?",

{t:"san", q:"Wie müssen Rohre beschaffen sein, die beim Berstlining eingesetzt werden sollen?",

{t:"san", q:"Ab welcher Risstiefe gelten Kunststoffrohre als beschädigt?",
 a:"Ab einer Tiefe von 10 % der Wandung gelten Kratzspuren als Beschädigung des Rohres."},
{t:"san", q:"Erläutere die Vorgehensweise beim Press-Zieh-Verfahren! Wann kommt es zum Einsatz?",
 a:"Zuerst werden alle seitlichen Anschlüsse in kleinen offenen Gruben abgetrennt. Im Zielschacht wird eine Hydraulikstation aufgebaut, die vom Startschacht aus einen Konus zur Zielgrube zieht. Dabei wird das Altrohr Richtung Zielschacht aus dem Boden geschoben und ein gleich großes oder etwas größeres Rohr eingezogen. Am fest montierten Berstkopf in der Zielgrube wird das Altrohr zerlegt, die Scherben werden dort vollständig zutage gefördert und entsorgt.<br><b>Einsatz:</b> wenn der Auftraggeber fordert, die alten Leitungen vollständig aus dem Boden zu entfernen."},
{t:"san", q:"Erläutere die Vorgehensweise beim Pipe-Eating-Verfahren!",
 a:"Der alte schadhafte Kanal wird mit einer Rohrvortriebsmaschine überfahren und dabei weggefräst. Eine Vergrößerung der Nennweite ist uneingeschränkt möglich. Das zerkleinerte Fräsgut wird mit Wasser durch Schlauchleitungen abgefördert."},

{t:"wg", q:"Wie kann man Leckagen an Wasserleitungen orten?",

const $ = s => document.querySelector(s);
const app = $("#app");
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc = s => s;
function store(k,v){try{if(v===undefined){return JSON.parse(localStorage.getItem("lf16_"+k)||"null")}localStorage.setItem("lf16_"+k,JSON.stringify(v))}catch(e){return null}}
function solHTML(a){return Array.isArray(a)?"<ul>"+a.map(x=>"<li>"+x+"</li>").join("")+"</ul>":"<div>"+a+"</div>"}
function img(n){return n&&IMG[n]?`<img src="${IMG[n]}" alt="">`:""}

/* ---------- gemeinsamer Ankreuz-Block ---------- */
// st = {sel:Set, answered:bool, ok:bool}; returns html; wire with mcWire
function mcHTML(m,st){
  let h=`<p class="q">${m.q}</p>${m.multi?`<p class="hint">Hier sind <b>mehrere</b> Antworten richtig. Wähle alle aus und klicke auf „Prüfen“.</p>`:""}${img(m.img)}`;
  m.o.forEach((o,i)=>{let cls="opt";
    if(st.answered){if(m.c.includes(i))cls+=" right";else if(st.sel.has(i))cls+=" wrong"}else if(st.sel.has(i))cls+=" sel";
    h+=`<button class="${cls}" data-mi="${i}" ${st.answered?"disabled":""}><span class="k">${i+1}</span>${o}</button>`});
  if(m.multi&&!st.answered)h+=`<div class="row"><button class="btn main" id="mcchk" ${st.sel.size?"":"disabled"}>Prüfen</button></div>`;
  if(st.answered)h+=`<div class="fb ${st.ok?"ok":"no"}">${st.ok?"Richtig!":"Leider falsch. Richtig ist: "+m.c.map(i=>m.o[i]).join(" und ")}</div>`;
  return h;
}
function mcWire(m,st,rerender,onAnswer){
  const check=()=>{st.ok=st.sel.size===m.c.length&&m.c.every(i=>st.sel.has(i));st.answered=true;if(onAnswer)onAnswer(st.ok);rerender()};
  app.querySelectorAll("[data-mi]").forEach(b=>b.onclick=()=>{const i=+b.dataset.mi;
    if(m.multi){st.sel.has(i)?st.sel.delete(i):st.sel.add(i);rerender()}else{st.sel=new Set([i]);check()}});
  const c=$("#mcchk");if(c)c.onclick=check;
}
const newSt=()=>({sel:new Set(),answered:false,ok:false});

/* ---------- Lernkarten ---------- */
KARTEN.forEach((k,i)=>k.id="k"+i);
let known = new Set(store("known")||[]);
let K = {thema:"alle", nurOffen:false, list:[], pos:0, shown:false, mix:false};
function kBuild(){
  let l = KARTEN.filter(k=>K.thema==="alle"||k.t===K.thema);
  if(K.nurOffen) l = l.filter(k=>!known.has(k.id));
  if(K.mix) l = shuffle(l);
  const mcs=shuffle(ALLMC);let out=[];l.forEach((k,i)=>{out.push(k);if(i%3===2&&i<l.length-1)out.push({mc:mcs[(i/3|0)%mcs.length],st:newSt()})});
  K.list=out; K.pos=0; K.shown=false;
}
function kRender(){
  const pool = KARTEN.filter(k=>K.thema==="alle"||k.t===K.thema);
  const gew = pool.filter(k=>known.has(k.id)).length;
  let h = `<div class="bar">
   <select id="kt"><option value="alle">Alle Themen</option>${THEMEN.map(t=>`<option value="${t.id}" ${K.thema===t.id?"selected":""}>${t.name}</option>`).join("")}</select>
   <label><input type="checkbox" id="ko" ${K.nurOffen?"checked":""}> nur noch nicht gewusste</label>
   <label><input type="checkbox" id="km" ${K.mix?"checked":""}> mischen</label></div>
   <div class="score">${gew} von ${pool.length} Karten gewusst</div>
   <div class="prog"><div style="width:${pool.length?gew/pool.length*100:0}%"></div></div>`;
  if(!K.list.length){
    h += `<div class="card"><p class="q">Super, in diesem Bereich hast du alle Karten gewusst!</p><div class="row"><button class="btn main" id="kreset">Markierungen zurücksetzen</button></div></div>`;
  } else {
    const k = K.list[K.pos];
    if(k.mc){
      h += `<div class="card"><div class="meta"><span>Zwischenfrage zum Ankreuzen</span><span>${K.pos+1} / ${K.list.length}</span></div>${mcHTML(k.mc,k.st)}
       <div class="row"><button class="btn" id="kprev" ${K.pos===0?"disabled":""}>‹ zurück</button><button class="btn ${k.st.answered?"main":""}" id="knext" ${K.pos>=K.list.length-1?"disabled":""}>weiter ›</button></div></div>`;
      app.innerHTML=h; kWire(); mcWire(k.mc,k.st,kRender); return;
    }
    const th = THEMEN.find(t=>t.id===k.t).name;
    h += `<div class="card"><div class="meta"><span>${th}</span><span>Karte ${K.pos+1} / ${K.list.length}${known.has(k.id)?" · ✓ gewusst":""}</span></div>
     <p class="q">${k.q}</p>${img(k.img)}
     ${K.shown?`<div class="sol"><h4>Lösung</h4>${solHTML(k.a)}</div>
       <p class="hint">Vergleiche ehrlich mit deiner Antwort:</p>
       <div class="row"><button class="btn ok" id="kja">Hab ich gewusst</button><button class="btn no" id="knein">Muss ich nochmal üben</button></div>`
      :`<div class="row"><button class="btn main" id="kshow">Lösung zeigen</button></div>`}
     <div class="row"><button class="btn" id="kprev" ${K.pos===0?"disabled":""}>‹ zurück</button><button class="btn" id="knext" ${K.pos>=K.list.length-1?"disabled":""}>weiter ›</button></div></div>`;
  }
  app.innerHTML = h; kWire();
}
function kWire(){
  $("#kt").onchange=e=>{K.thema=e.target.value;kBuild();kRender()};
  $("#ko").onchange=e=>{K.nurOffen=e.target.checked;kBuild();kRender()};
  $("#km").onchange=e=>{K.mix=e.target.checked;kBuild();kRender()};
  const b=(id,f)=>{const el=$(id);if(el)el.onclick=f};
  b("#kshow",()=>{K.shown=true;kRender()});
  b("#kprev",()=>{K.pos--;K.shown=false;kRender()});
  b("#knext",()=>{K.pos++;K.shown=false;kRender()});
  const mark=v=>{const k=K.list[K.pos];v?known.add(k.id):known.delete(k.id);store("known",[...known]);
    if(K.pos<K.list.length-1){K.pos++;K.shown=false}else{K.shown=false; if(K.nurOffen){kBuild()}} kRender()};
  b("#kja",()=>mark(true)); b("#knein",()=>mark(false));
  b("#kreset",()=>{KARTEN.filter(k=>K.thema==="alle"||k.t===K.thema).forEach(k=>known.delete(k.id));store("known",[...known]);kBuild();kRender()});
}

/* ---------- Ankreuzen ---------- */
let M = {list:[], pos:0, right:0, done:false, answered:false, sel:new Set(), wrong:[]};
function mStart(list){M.list=list||shuffle(ALLMC);M.pos=0;M.right=0;M.done=false;M.answered=false;M.sel=new Set();M.wrong=[]}
function mRender(){
  if(M.done){
    const n=M.list.length;
    app.innerHTML=`<div class="card"><p class="q">Geschafft!</p><div class="big">${M.right} / ${n}</div><p>richtig beantwortet</p>
     <div class="row"><button class="btn main" id="mneu">Nochmal alle (neu gemischt)</button>${M.wrong.length?`<button class="btn" id="mwr">Nur die ${M.wrong.length} falschen wiederholen</button>`:""}</div></div>`;
    $("#mneu").onclick=()=>{mStart();mRender()};
    if($("#mwr"))$("#mwr").onclick=()=>{mStart(shuffle(M.wrong));mRender()};
    return;
  }
  const m=M.list[M.pos];
  let h=`<div class="score">Frage ${M.pos+1} von ${M.list.length} · ${M.right} richtig</div><div class="prog"><div style="width:${M.pos/M.list.length*100}%;background:var(--acc)"></div></div>
   <div class="card"><p class="q">${m.q}</p>${m.multi?`<p class="hint">Hier sind <b>mehrere</b> Antworten richtig. Wähle alle aus und klicke auf „Prüfen“.</p>`:""}${img(m.img)}`;
  m.o.forEach((o,i)=>{
    let cls="opt";
    if(M.answered){ if(m.c.includes(i))cls+=" right"; else if(M.sel.has(i))cls+=" wrong"; }
    else if(M.sel.has(i))cls+=" sel";
    h+=`<button class="${cls}" data-i="${i}" ${M.answered?"disabled":""}><span class="k">${i+1}</span>${o}</button>`;
  });
  if(m.multi&&!M.answered)h+=`<div class="row"><button class="btn main" id="mchk" ${M.sel.size?"":"disabled"}>Prüfen</button></div>`;
  if(M.answered){
    const ok=M.lastOk;
    h+=`<div class="fb ${ok?"ok":"no"}">${ok?"Richtig!":"Leider falsch. Richtig ist: "+m.c.map(i=>m.o[i]).join(" und ")}</div>
     <div class="row"><button class="btn main" id="mnext">${M.pos<M.list.length-1?"Nächste Frage ›":"Ergebnis anzeigen"}</button></div>`;
  }
  h+="</div>";
  app.innerHTML=h;
  const check=()=>{const ok=M.sel.size===m.c.length&&m.c.every(i=>M.sel.has(i));M.lastOk=ok;M.answered=true;if(ok)M.right++;else M.wrong.push(m);mRender()};
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(m.multi){M.sel.has(i)?M.sel.delete(i):M.sel.add(i);mRender()} else {M.sel=new Set([i]);check()}});
  if($("#mchk"))$("#mchk").onclick=check;
  if($("#mnext"))$("#mnext").onclick=()=>{M.answered=false;M.sel=new Set();if(M.pos<M.list.length-1)M.pos++;else M.done=true;mRender()};
}

/* ---------- Bilderquiz ---------- */
let B = {gruppe:"alle", list:[], pos:0, right:0, answered:null, opts:[]};
function bStart(){
  let l=[];BILDER.forEach((g,gi)=>{if(B.gruppe==="alle"||B.gruppe==gi)g.items.forEach(it=>l.push({g:gi,it}))});
  B.list=shuffle(l);B.pos=0;B.right=0;B.answered=null;bOpts();
}
function bOpts(){
  if(B.pos>=B.list.length)return;
  const cur=B.list[B.pos];const others=BILDER[cur.g].items.filter(x=>x!==cur.it);
  B.opts=shuffle([cur.it,...shuffle(others).slice(0,3)]);
}
function bRender(){
  let h=`<div class="bar"><select id="bg"><option value="alle">Alle Bildgruppen</option>${BILDER.map((g,i)=>`<option value="${i}" ${B.gruppe==i?"selected":""}>${g.gruppe}</option>`).join("")}</select></div>`;
  if(B.pos>=B.list.length){
    h+=`<div class="card"><p class="q">Fertig!</p><div class="big">${B.right} / ${B.list.length}</div><p>Bilder richtig erkannt</p><div class="row"><button class="btn main" id="bneu">Nochmal</button></div></div>`;
    app.innerHTML=h;$("#bneu").onclick=()=>{bStart();bRender()};
  } else {
    const cur=B.list[B.pos],g=BILDER[cur.g];
    h+=`<div class="score">Bild ${B.pos+1} von ${B.list.length} · ${B.right} richtig</div><div class="prog"><div style="width:${B.pos/B.list.length*100}%;background:var(--acc)"></div></div>
     <div class="card"><div class="meta"><span>${g.gruppe}</span></div><p class="q">${g.frage}</p>${img(cur.it[0])}`;
    B.opts.forEach((o,i)=>{let cls="opt";if(B.answered!==null){if(o===cur.it)cls+=" right";else if(B.answered===i)cls+=" wrong"}
      h+=`<button class="${cls}" data-i="${i}" ${B.answered!==null?"disabled":""}>${o[1]}</button>`});
    if(B.answered!==null){const ok=B.opts[B.answered]===cur.it;
      h+=`<div class="fb ${ok?"ok":"no"}">${ok?"Richtig!":"Falsch. Das ist: "+cur.it[1]}${cur.it[2]?" ("+cur.it[2]+")":""}</div>
       <div class="row"><button class="btn main" id="bnext">Weiter ›</button></div>`}
    h+="</div>";
    app.innerHTML=h;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{B.answered=+b.dataset.i;if(B.opts[B.answered]===cur.it)B.right++;bRender()});
    if($("#bnext"))$("#bnext").onclick=()=>{B.pos++;B.answered=null;bOpts();bRender()};
  }
  $("#bg").onchange=e=>{B.gruppe=e.target.value;bStart();bRender()};
}

/* ---------- Rechnen ---------- */
let R = RECHNEN.map(()=>({val:"",res:null,weg:false}));
function rRender(){
  let h=`<p class="hint">Projekt Leitungssanierung. Rechne auf einem Blatt, trage dein Ergebnis ein und prüfe es. Den Lösungsweg kannst du jederzeit aufdecken. Rechne mit 3,14 bzw. 0,785.</p>`;
  RECHNEN.forEach((r,i)=>{const s=R[i];
    h+=`<div class="card" style="margin-bottom:14px"><div class="meta"><span>Aufgabe ${i+1}</span></div><p class="q">${r.q}</p>
     <div class="bar"><input type="text" inputmode="decimal" id="ri${i}" value="${s.val}" placeholder="Ergebnis"><span class="unit">${r.unit}</span>
     <button class="btn main" data-c="${i}">Prüfen</button><button class="btn" data-w="${i}">${s.weg?"Lösungsweg ausblenden":"Lösungsweg zeigen"}</button></div>
     ${s.res===null?"":`<div class="fb ${s.res?"ok":"no"}">${s.res?"Richtig!":"Stimmt noch nicht. Prüfe deine Rechnung oder schau dir den Lösungsweg an."}</div>`}
     ${s.weg?`<div class="sol"><h4>Lösungsweg</h4>${solHTML(r.weg)}</div>`:""}</div>`});
  app.innerHTML=h;
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const i=+b.dataset.c;let v=$("#ri"+i).value.replace(/\s/g,"");if(v.includes(","))v=v.replace(/\./g,"").replace(",",".");
    R[i].val=$("#ri"+i).value;const n=parseFloat(v);R[i].res=!isNaN(n)&&Math.abs(n-RECHNEN[i].res)<=RECHNEN[i].tol;rRender()});
  app.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{const i=+b.dataset.w;R[i].val=$("#ri"+i).value;R[i].weg=!R[i].weg;rRender()});
}

/* ---------- 30-Minuten-Training ---------- */
let T={};
function tStart(){
  const mcs=shuffle(ALLMC).slice(0,24);
  let bil=[];BILDER.forEach((g,gi)=>g.items.forEach(it=>bil.push({g:gi,it})));bil=shuffle(bil).slice(0,8);
  const rec=shuffle(RECHNEN.map((r,i)=>i)).slice(0,3);
  const karten=shuffle(KARTEN).slice(0,5);
  let items=[];let mi=0,bi=0,ri=0,ki=0;
  // Muster: 3 Ankreuzen, 1 Bild, ... dazwischen Rechnen und offene Fragen
  const pat="MMBMKMBMRMMBMKMBMMRMBMKMBMMRMBMKMBMMKB";
  for(const ch of pat){
    if(ch==="M"&&mi<mcs.length)items.push({type:"mc",m:mcs[mi++],st:newSt()});
    else if(ch==="B"&&bi<bil.length){const b=bil[bi++];const others=BILDER[b.g].items.filter(x=>x!==b.it);items.push({type:"bild",b,opts:shuffle([b.it,...shuffle(others).slice(0,3)]),ans:null})}
    else if(ch==="R"&&ri<rec.length)items.push({type:"rech",i:rec[ri++],val:"",res:null,weg:false});
    else if(ch==="K"&&ki<karten.length)items.push({type:"karte",k:karten[ki++],shown:false,self:null});
  }
  T={items,pos:0,start:Date.now(),done:false};
}
function tScore(){let p=0,n=0;T.items.forEach(x=>{
  if(x.type==="mc"&&x.st.answered){n++;if(x.st.ok)p++}
  if(x.type==="bild"&&x.ans!==null){n++;if(x.opts[x.ans]===x.b.it)p++}
  if(x.type==="rech"&&x.res!==null){n++;if(x.res)p++}
  if(x.type==="karte"&&x.self!==null){n++;if(x.self)p++}
 });return [p,n]}
let tTimer=null;
function tRender(){
  clearInterval(tTimer);
  const [p,n]=tScore();
  if(T.done){
    const min=Math.round((Date.now()-T.start)/60000);
    app.innerHTML=`<div class="card"><p class="q">Training abgeschlossen!</p><div class="big">${p} / ${n}</div><p>richtig in etwa ${min} Minuten</p>
     <div class="row"><button class="btn main" id="tneu">Neues Training starten</button></div><p class="hint">Jedes Training wird neu gemischt, du bekommst also andere Aufgaben.</p></div>`;
    $("#tneu").onclick=()=>{tStart();tRender()};return;
  }
  const x=T.items[T.pos];
  const fertig = x.type==="mc"?x.st.answered:x.type==="bild"?x.ans!==null:x.type==="rech"?x.res!==null:x.self!==null;
  let h=`<div class="score" style="display:flex;justify-content:space-between"><span>Aufgabe ${T.pos+1} von ${T.items.length} · ${p} richtig</span><span id="tclock"></span></div>
   <div class="prog"><div style="width:${T.pos/T.items.length*100}%;background:var(--acc)"></div></div><div class="card">`;
  if(x.type==="mc"){h+=`<div class="meta"><span>Ankreuzen</span></div>`+mcHTML(x.m,x.st)}
  if(x.type==="bild"){const g=BILDER[x.b.g];h+=`<div class="meta"><span>Bilderquiz · ${g.gruppe}</span></div><p class="q">${g.frage}</p>${img(x.b.it[0])}`;
    x.opts.forEach((o,i)=>{let cls="opt";if(x.ans!==null){if(o===x.b.it)cls+=" right";else if(x.ans===i)cls+=" wrong"}
      h+=`<button class="${cls}" data-bi="${i}" ${x.ans!==null?"disabled":""}>${o[1]}</button>`});
    if(x.ans!==null){const ok=x.opts[x.ans]===x.b.it;h+=`<div class="fb ${ok?"ok":"no"}">${ok?"Richtig!":"Falsch. Das ist: "+x.b.it[1]}${x.b.it[2]?" ("+x.b.it[2]+")":""}</div>`}}
  if(x.type==="rech"){const r=RECHNEN[x.i];h+=`<div class="meta"><span>Rechnen</span></div><p class="q">${r.q}</p><p class="hint">Rechne auf einem Blatt (mit 3,14 bzw. 0,785) und trage das Ergebnis ein.</p>
    <div class="bar"><input type="text" inputmode="decimal" id="tri" value="${x.val}" placeholder="Ergebnis" ${x.res!==null?"disabled":""}><span class="unit">${r.unit}</span>${x.res===null?`<button class="btn main" id="trchk">Prüfen</button>`:""}</div>
    ${x.res===null?"":`<div class="fb ${x.res?"ok":"no"}">${x.res?"Richtig!":"Stimmt leider nicht."}</div><div class="sol"><h4>Lösungsweg</h4>${solHTML(r.weg)}</div>`}`}
  if(x.type==="karte"){h+=`<div class="meta"><span>Offene Frage · erst selbst überlegen</span></div><p class="q">${x.k.q}</p>${img(x.k.img)}`;
    if(!x.shown)h+=`<div class="row"><button class="btn main" id="tks">Lösung zeigen</button></div>`;
    else{h+=`<div class="sol"><h4>Lösung</h4>${solHTML(x.k.a)}</div>`;
      if(x.self===null)h+=`<p class="hint">Vergleiche ehrlich:</p><div class="row"><button class="btn ok" id="tkj">Hab ich gewusst</button><button class="btn no" id="tkn">Nicht gewusst</button></div>`;
      else h+=`<div class="fb ${x.self?"ok":"no"}">${x.self?"Gut gemacht!":"Merk dir die Lösung, die Frage kommt bestimmt wieder."}</div>`}}
  h+=`<div class="row"><button class="btn ${fertig?"main":""}" id="tnext" ${fertig?"":"disabled"}>${T.pos<T.items.length-1?"Weiter ›":"Ergebnis anzeigen"}</button></div></div>`;
  app.innerHTML=h;
  const clk=()=>{const s=Math.floor((Date.now()-T.start)/1000);const el=$("#tclock");if(el)el.textContent="⏱ "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};clk();tTimer=setInterval(clk,1000);
  if(x.type==="mc")mcWire(x.m,x.st,tRender);
  app.querySelectorAll("[data-bi]").forEach(b=>b.onclick=()=>{x.ans=+b.dataset.bi;tRender()});
  if($("#trchk"))$("#trchk").onclick=()=>{x.val=$("#tri").value;let v=x.val.replace(/\s/g,"");if(v.includes(","))v=v.replace(/\./g,"").replace(",",".");const nn=parseFloat(v);if(isNaN(nn))return;x.res=Math.abs(nn-RECHNEN[x.i].res)<=RECHNEN[x.i].tol;tRender()};
  if($("#tks"))$("#tks").onclick=()=>{x.shown=true;tRender()};
  if($("#tkj"))$("#tkj").onclick=()=>{x.self=true;tRender()};
  if($("#tkn"))$("#tkn").onclick=()=>{x.self=false;tRender()};
  $("#tnext").onclick=()=>{if(T.pos<T.items.length-1)T.pos++;else T.done=true;tRender();window.scrollTo(0,0)};
}

/* ---------- Tabs ---------- */
const TABS={train:tRender,karten:kRender,mc:mRender,bilder:bRender,rechnen:rRender};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{clearInterval(tTimer);document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");TABS[b.dataset.tab]();window.scrollTo(0,0)});
kBuild();mStart();bStart();tStart();tRender();
</script>
</body>
