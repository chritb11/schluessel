<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LF 16 Wiederholung: Spülen und mechanisch reinigen</title>
<style>
:root{--bg:#ECEAE4;--paper:#fff;--ink:#222;--muted:#666;--line:#CFCBC2;--acc:#2F6E73;--hl:#FFF1D6;--ok:#2E6F48;--bad:#B3261E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:1.45}
header{padding:14px 16px 4px;max-width:820px;margin:0 auto}
header h1{font-size:20px;margin:0}
header .sub{font-size:14px;color:var(--muted)}
.bar{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 0}
.bar button{width:34px;height:34px;border:1px solid var(--line);background:#F4F2EC;border-radius:4px;font:inherit;font-size:14px;cursor:pointer}
.bar button.now{background:var(--acc);color:#fff;border-color:var(--acc)}
.bar button.done{background:#555;color:#fff;border-color:#555}
main{max-width:820px;margin:0 auto;padding:8px 16px 30px}
.card{background:var(--paper);border:1px solid #bbb;padding:16px 18px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.no{font-size:13px;font-weight:bold;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin:0 0 4px}
h2{font-size:21px;margin:0 0 8px}
.task{background:var(--hl);border-left:5px solid #E2A23B;padding:8px 12px;margin:8px 0 12px}
.opt{display:block;width:100%;text-align:left;font:inherit;padding:10px 12px;margin:6px 0;border:2px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;color:var(--ink)}
.opt.sel{border-color:var(--ink);background:#F4F2EC}
.opt.ok{border-color:var(--ok);background:#E7F2EA}
.opt.bad{border-color:var(--bad);background:#FBE9E7}
select{font:inherit;font-size:16px;padding:5px;max-width:100%;border:2px solid var(--line);border-radius:4px;background:#fff}
select.ok{border-color:var(--ok);background:#E7F2EA}
select.bad{border-color:var(--bad);background:#FBE9E7}
.txt{line-height:2.1}
.row{border-bottom:1px solid var(--line);padding:8px 0}
.row .q{margin-bottom:4px}
.pair{display:flex;gap:6px}
.pair button{flex:1;font:inherit;font-size:15px;padding:8px;border:2px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;color:var(--ink)}
.pair button.sel{border-color:var(--ink);background:#F4F2EC;font-weight:bold}
.pair button.ok{border-color:var(--ok);background:#E7F2EA}
.pair button.bad{border-color:var(--bad);background:#FBE9E7}
.ord{list-style:none;padding:0;margin:0}
.ord li{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:#fff;border-radius:6px;padding:8px;margin:6px 0}
.ord li.ok{border-color:var(--ok);background:#E7F2EA}
.ord li.bad{border-color:var(--bad);background:#FBE9E7}
.ord .t{flex:1}
.ord button{font:inherit;width:40px;height:36px;border:1px solid #999;background:#F4F2EC;border-radius:4px;cursor:pointer}
svg{display:block;width:100%;height:auto;background:#FAF9F6;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font:inherit;font-size:15px;padding:7px 10px;border:2px solid #999;background:#fff;border-radius:16px;cursor:pointer;color:var(--ink)}
.chip.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.used{opacity:.35}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}
.slot{display:flex;align-items:center;gap:8px;border:2px dashed #999;border-radius:6px;padding:6px 8px;cursor:pointer;min-height:42px;background:#fff}
.slot b{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#222;color:#fff;font-size:14px;flex:none}
.slot.ok{border:2px solid var(--ok);background:#E7F2EA}
.slot.bad{border:2px solid var(--bad);background:#FBE9E7}
.nav{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.nav button{flex:1;min-width:120px;font:inherit;font-weight:bold;padding:12px;border:2px solid var(--ink);background:#fff;border-radius:6px;cursor:pointer;color:var(--ink)}
.nav button.primary{background:var(--ink);color:#fff}
.fb{margin-top:12px;padding:10px 12px;border-radius:6px;display:none}
.fb.show{display:block}
.fb.good{background:#E7F2EA;border:1px solid var(--ok)}
.fb.mid{background:var(--hl);border:1px solid #E2A23B}
.why{font-size:15px;color:#444;margin-top:4px;display:none}
.why.show{display:block}
.big{font-size:42px;font-weight:bold;margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:16px}
td,th{border:1px solid var(--line);padding:6px 8px;text-align:left}
th{background:#F4F2EC}
</style></head>
<body>
<header>
  <h1>LF 16 Wiederholung: Spülen und mechanisch reinigen</h1>
  <div class="sub">BRO 12 · 7 Stationen · erst lösen, dann „Prüfen“ drücken</div>
  <div class="bar" id="bar"></div>
</header>
<main><div class="card" id="card"></div></main>
<script>
const S=[];let cur=0;const score={};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild};

/* 1 Reihenfolge */
S.push({title:'Der Sanierungsablauf',task:'Bringen Sie die Schritte einer Sanierung in die richtige Reihenfolge. Mit ▲ und ▼ verschieben.',
right:['Reinigung der Leitung','Inspektion und Bestandsaufnahme','Auswahl eines geeigneten Verfahrens','Sanierung der Leitung','Erfolgskontrolle (Prüfung)'],
render(c){const ul=el('<ul class="ord"></ul>');let a=shuffle(this.right);while(a.join()==this.right.join())a=shuffle(this.right);
 a.forEach(t=>{const li=el(`<li><span class="t">${t}</span><button>▲</button><button>▼</button></li>`);const [up,dn]=li.querySelectorAll('button');
  up.onclick=()=>{if(li.previousElementSibling)ul.insertBefore(li,li.previousElementSibling)};dn.onclick=()=>{if(li.nextElementSibling)ul.insertBefore(li.nextElementSibling,li)};ul.appendChild(li)});c.appendChild(ul)},
check(c){let p=0;c.querySelectorAll('.ord li').forEach((li,i)=>{li.classList.remove('ok','bad');const ok=li.querySelector('.t').textContent==this.right[i];li.classList.add(ok?'ok':'bad');if(ok)p++});
 return [p,5,'Ohne Reinigung keine brauchbare Inspektion: Ablagerungen verdecken die Schäden. Darum kommt als Nächstes die Inspektion.']}});

/* 2 Lückentext Stauspülung */
S.push({title:'So funktioniert die Stauspülung',task:'Wählen Sie in jeder Lücke das richtige Wort.',
gaps:[['oberen',['oberen','unteren']],['Spülkörper',['Spülkörper','Spülkopf','Fräsroboter']],['staut',['staut','verdunstet','versickert']],['Staudruck',['Staudruck','Pumpendruck','Luftdruck']],['wenig verfestigte',['wenig verfestigte','stark verfestigte']],['Gefälle',['Gefälle','Rohrdurchmesser']],['vermaschten',['vermaschten','geraden']],['eine Kette oder ein Seil',['eine Kette oder ein Seil','einen Hochdruckschlauch']]],
render(c){const g=this.gaps;const s=i=>`<select data-r="${g[i][0]}"><option value="">…</option>${shuffle(g[i][1]).map(o=>`<option>${o}</option>`).join('')}</select>`;
 c.appendChild(el(`<div class="txt">Ein ${s(1)} (z. B. Spülkugel, Spülschild oder Spülschraube) wird am ${s(0)} Ende des Abschnitts in das Rohr gesetzt. Dahinter ${s(2)} sich das nachfließende Wasser. Der ${s(3)} schiebt ihn durch die Leitung, dabei werden ${s(4)} Ablagerungen abgeschwemmt. Zurückgeholt wird er über ${s(7)}. Die Stauspülung klappt nicht bei zu geringem ${s(5)} und in ${s(6)} Netzen.</div>`))},
check(c){let p=0;c.querySelectorAll('select').forEach(s=>{const ok=s.value==s.dataset.r;s.classList.remove('ok','bad');s.classList.add(ok?'ok':'bad');if(ok)p++});return [p,8,'']}});

/* 3 Beschriften HD-Spülung */
S.push({title:'Hochdruckspülung beschriften',task:'Die Haltung fällt von S1 nach S2. Tippen Sie erst auf einen Begriff, dann auf das passende Feld unter der Skizze.',
labels:['Spülfahrzeug','Startschacht (tiefer)','Spülkopf','Spülschlauch','Fließrichtung des Abwassers','Arbeitsrichtung des Spülkopfs','Blase'],
render(c){
 const svg=`<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial" font-size="14">
 <rect x="0" y="60" width="700" height="240" fill="#E9E1D3"/><line x1="0" y1="60" x2="700" y2="60" stroke="#555" stroke-width="2"/>
 <rect x="70" y="60" width="40" height="140" fill="#FAF9F6" stroke="#444" stroke-width="2"/><text x="90" y="52" text-anchor="middle">S1</text>
 <rect x="510" y="60" width="40" height="180" fill="#FAF9F6" stroke="#444" stroke-width="2"/><text x="530" y="52" text-anchor="middle">S2</text>
 <polygon points="110,178 510,218 510,238 110,198" fill="#FAF9F6" stroke="#444" stroke-width="2"/>
 <polygon points="550,218 700,233 700,253 550,238" fill="#FAF9F6" stroke="#444" stroke-width="2"/>
 <ellipse cx="575" cy="230" rx="11" ry="10" fill="#C9C2B0" stroke="#444" stroke-width="2"/>
 <path d="M150 200 L230 208 L230 213 L150 205Z" fill="#8C7B5E"/>
 <rect x="560" y="18" width="110" height="38" rx="4" fill="#9AA7A8" stroke="#444" stroke-width="2"/><rect x="640" y="24" width="30" height="20" fill="#DDE3E3" stroke="#444"/>
 <circle cx="580" cy="58" r="7" fill="#333"/><circle cx="650" cy="58" r="7" fill="#333"/>
 <path d="M565 40 C 535 40 530 60 530 80 L530 226 L300 203" fill="none" stroke="#1F4E79" stroke-width="3"/>
 <polygon points="300,197 282,201 282,207 300,209" fill="#1F4E79"/>
 <g stroke="#1F7FBF" stroke-width="2"><line x1="300" y1="200" x2="322" y2="193"/><line x1="300" y1="208" x2="322" y2="215"/><line x1="282" y1="204" x2="266" y2="202"/></g>
 <line x1="200" y1="160" x2="330" y2="173" stroke="#2E6F48" stroke-width="3"/><polygon points="338,174 324,166 323,180" fill="#2E6F48"/>
 <line x1="420" y1="258" x2="320" y2="248" stroke="#B3261E" stroke-width="3"/><polygon points="312,247 326,240 325,254" fill="#B3261E"/>
 ${[[615,12,1],[488,100,2],[290,228,3],[530,150,4],[260,150,5],[440,270,6],[598,206,7]].map(n=>`<circle cx="${n[0]}" cy="${n[1]}" r="12" fill="#222"/><text x="${n[0]}" y="${n[1]+5}" fill="#fff" text-anchor="middle" font-weight="bold">${n[2]}</text>`).join('')}
 </svg>`;
 c.appendChild(el(`<div>${svg}</div>`));
 /* richtige Zuordnung Nummer -> Begriff */
 this.key={1:'Spülfahrzeug',2:'Startschacht (tiefer)',3:'Spülkopf',4:'Spülschlauch',5:'Fließrichtung des Abwassers',6:'Arbeitsrichtung des Spülkopfs',7:'Blase'};
 const chips=el('<div class="chips"></div>');let sel=null;
 shuffle(this.labels).forEach(l=>{const b=el(`<button class="chip">${l}</button>`);b.onclick=()=>{chips.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b};chips.appendChild(b)});
 c.appendChild(chips);
 const slots=el('<div class="slots"></div>');
 for(let i=1;i<=7;i++){const s=el(`<div class="slot" data-n="${i}"><b>${i}</b><span>…</span></div>`);
  s.onclick=()=>{if(!sel){if(s.dataset.v){const old=[...chips.children].find(x=>x.textContent==s.dataset.v);if(old)old.classList.remove('used');s.dataset.v='';s.querySelector('span').textContent='…'}return}
   const prev=slots.querySelector(`.slot[data-v="${sel.textContent}"]`);if(prev){prev.dataset.v='';prev.querySelector('span').textContent='…'}
   if(s.dataset.v){const old=[...chips.children].find(x=>x.textContent==s.dataset.v);if(old)old.classList.remove('used')}
   s.dataset.v=sel.textContent;s.querySelector('span').textContent=sel.textContent;sel.classList.remove('sel');sel.classList.add('used');sel=null};
  slots.appendChild(s)}
 c.appendChild(slots);c.appendChild(el('<div class="small" style="font-size:14px;color:#666;margin-top:6px">Falsch abgelegt? Feld antippen, dann ist es wieder leer.</div>'))},
check(c){let p=0;c.querySelectorAll('.slot').forEach(s=>{s.classList.remove('ok','bad');const ok=s.dataset.v==this.key[s.dataset.n];s.classList.add(ok?'ok':'bad');if(ok)p++});
 return [p,7,'Das Fahrzeug steht am <b>tieferen</b> Schacht. Der Spülkopf arbeitet sich <b>gegen</b> die Fließrichtung nach oben, das Spülgut wird zum Startschacht zurückgespült und abgesaugt. Die Blase verschließt den nächsttieferen Abschnitt.']}});

/* 4 Welches Verfahren */
S.push({title:'Welches Verfahren passt?',task:'Wählen Sie für jeden Fall das passende Reinigungsverfahren.',
rows:[['Grundleitung DN 100 im Keller ist verstopft.','Spirale'],['Lockerer Sand und Schlamm auf der Sohle, Kanal DN 600.','HD-Spülung'],['Abwasserdruckleitung mit Ablagerungen.','Molchen'],['Anschlussstutzen ragt 4 cm in den Kanal DN 300.','Fräsroboter'],['Harte Inkrustationen an der Rohrwand, Kanal DN 200.','Kettenschleuder'],['Nach dem Einbau des Schlauchliners müssen die Zuläufe wieder geöffnet werden.','Fräsroboter']],
render(c){const v=['HD-Spülung','Spirale','Kettenschleuder','Fräsroboter','Molchen'];const t=el('<table><tr><th>Fall</th><th>Verfahren</th></tr></table>');
 shuffle(this.rows).forEach(r=>{const tr=el(`<table><tr><td>${r[0]}</td><td><select data-r="${r[1]}"><option value="">bitte wählen</option>${v.map(x=>`<option>${x}</option>`).join('')}</select></td></tr></table>`).querySelector('tr');t.querySelector('tbody').appendChild(tr)});c.appendChild(t)},
check(c){let p=0;c.querySelectorAll('select').forEach(s=>{let ok=s.value==s.dataset.r;if(s.dataset.r=='Kettenschleuder'&&s.value=='Fräsroboter')ok=true;s.classList.remove('ok','bad');s.classList.add(ok?'ok':'bad');if(ok)p++});
 return [p,6,'Bei harten Inkrustationen ist auch der Fräsroboter richtig.']}});

/* 5 Hydrodynamisch oder mechanisch */
S.push({title:'Spülen oder mechanisch?',task:'Passt die Aussage zur HD-Spülung oder zur mechanischen Reinigung?',
items:[['Ein Wasserstrahl mit hohem Druck löst die Ablagerungen.','H'],['Werkzeuge fräsen oder schlagen Ablagerungen ab.','M'],['Der Rückstoß treibt den Schlauch voran.','H'],['Richtig für Wurzeleinwuchs und ausgehärteten Beton.','M'],['Richtig für Sand, Schlamm und Sielhaut.','H'],['Danach muss das Rohr oft neu beschichtet werden.','M'],['Hat bei der Reinigung Vorrang, weil es die Rohroberfläche schont.','H'],['Werkzeug muss zu Ablagerung und Rohrwerkstoff passen, sonst wird die Rohrwand beschädigt.','M']],
render(c){shuffle(this.items).forEach(it=>{const d=el(`<div class="row"><div class="q">${it[0]}</div><div class="pair"><button data-v="H">HD-Spülung</button><button data-v="M">mechanisch</button></div></div>`);d.dataset.r=it[1];
 d.querySelectorAll('button').forEach(b=>b.onclick=()=>{d.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});c.appendChild(d)})},
check(c){let p=0;c.querySelectorAll('.row').forEach(r=>{r.querySelectorAll('button').forEach(b=>{b.classList.remove('ok','bad');if(b.classList.contains('sel'))b.classList.add(b.dataset.v==r.dataset.r?'ok':'bad')});const s=r.querySelector('.sel');if(s&&s.dataset.v==r.dataset.r)p++});return [p,8,'']}});

/* 6 Zahlen und Fakten */
S.push({title:'Zahlen rund ums Spülen',task:'Wählen Sie jeweils die richtige Antwort.',
qs:[['Mit welchem Druck arbeitet das Spülfahrzeug ungefähr?',['10 bis 15 MPa (100 bis 150 bar)','1 bis 1,5 MPa (10 bis 15 bar)','100 bis 150 MPa'],0],
 ['Welcher Druck kommt am Spülkopf noch an?',['8 bis 10 MPa (80 bis 100 bar)','10 bis 15 MPa','0,8 bis 1 MPa'],0],
 ['Welche Düsen halten den Spülkopf in der Mitte des Rohres?',['die radialen Düsen','die axialen Düsen','die Düsen schräg nach hinten'],0],
 ['Welche Düsen lösen Verstopfungen direkt vor dem Kopf?',['die axialen Düsen (nach vorn)','die radialen Düsen','die Düsen schräg nach hinten'],0],
 ['Ab welcher Größe kann die Spirale eingesetzt werden?',['ab DN 40','ab DN 300','ab DN 800'],0]],
render(c){this.qs.forEach((q,qi)=>{const d=el(`<div class="row"><div class="q"><b>${q[0]}</b></div></div>`);shuffle(q[1].map((o,i)=>[o,i])).forEach(([o,i])=>{const b=el(`<button class="opt">${o}</button>`);b.dataset.r=i==q[2]?1:0;b.onclick=()=>{d.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};d.appendChild(b)});c.appendChild(d)})},
check(c){let p=0;c.querySelectorAll('.row').forEach(r=>{r.querySelectorAll('.opt').forEach(b=>{b.classList.remove('ok','bad');if(b.dataset.r=='1')b.classList.add('ok');else if(b.classList.contains('sel'))b.classList.add('bad')});const s=r.querySelector('.sel');if(s&&s.dataset.r=='1')p++});return [p,5,'']}});

/* 7 Transfer */
S.push({title:'Was machen Sie auf der Baustelle?',task:'Entscheiden Sie wie ein Vorarbeiter. Nach dem Prüfen steht unter jedem Fall die Begründung.',
qs:[['Haltung S5 (höher) → S6. Regenwasserkanal DN 400, Sand und Laub, locker. Gefälle gut, Netz nicht vermascht. Was nehmen Sie?',['Stauspülung, Spülkörper bei S5 einsetzen','Hochdruckspülung, Start in S5','Fräsroboter'],0,'Lockere Ablagerungen, gutes Gefälle, kein vermaschtes Netz: Die Stauspülung reicht und ist das einfachste Verfahren. Der Spülkörper kommt ans <b>obere</b> Ende.'],
 ['Haltung S7 (höher) → S8. Verfestigte Ablagerungen, Netz vermascht. Wo setzen Sie den HD-Spülkopf ein?',['in S8, gegen die Fließrichtung','in S7, mit der Fließrichtung','egal, Hauptsache schnell'],0,'Start im tieferen Schacht S8. So wird das Spülgut zum Startschacht gespült und abgesaugt, statt vor dem Kopf herzulaufen und das Rohr zu verstopfen.'],
 ['Die HD-Spülung ist fertig, aber Baumwurzeln hängen noch an der Muffe. Der Liner soll morgen rein. Was jetzt?',['Wurzeln mit dem Fräsroboter entfernen, nachspülen, absaugen, dann TV-Inspektion','Liner einziehen, der drückt die Wurzeln an die Wand','noch zweimal mit Hochdruck spülen und dann den Liner einbauen'],0,'Wurzeln gehören nicht zur normalen HD-Spülung, sie werden mechanisch entfernt. Hindernisse verhindern den Einbau des Liners. Vor der Sanierung kommt die Inspektion.'],
 ['Steinzeugkanal mit harten Ablagerungen. Ein Kollege will den härtesten Fräskopf nehmen, „dann geht es schneller“. Ihre Meinung?',['Nein: Werkzeug passend zu Ablagerung und Rohrwerkstoff wählen, nur so viel wie nötig','Ja, Steinzeug hält alles aus','Ja, aber nur mit Wasser dazu'],0,'Ein zu hartes oder falsches Werkzeug greift die Rohrwand an. Mechanisch nur so viel wie nötig, am besten mit Kamera kontrollieren.']],
render(c){this.qs.forEach(q=>{const d=el(`<div class="row"><div class="q"><b>${q[0]}</b></div></div>`);shuffle(q[1].map((o,i)=>[o,i])).forEach(([o,i])=>{const b=el(`<button class="opt">${o}</button>`);b.dataset.r=i==q[2]?1:0;b.onclick=()=>{d.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};d.appendChild(b)});d.appendChild(el(`<div class="why">${q[3]}</div>`));c.appendChild(d)})},
check(c){let p=0;c.querySelectorAll('.row').forEach(r=>{r.querySelectorAll('.opt').forEach(b=>{b.classList.remove('ok','bad');if(b.dataset.r=='1')b.classList.add('ok');else if(b.classList.contains('sel'))b.classList.add('bad')});r.querySelector('.why').classList.add('show');const s=r.querySelector('.sel');if(s&&s.dataset.r=='1')p++});return [p,4,'']}});

/* Ablauf */
const bar=document.getElementById('bar'),card=document.getElementById('card');
function drawBar(){bar.innerHTML='';for(let i=0;i<=S.length;i++){const b=document.createElement('button');b.textContent=i<S.length?i+1:'★';b.title=i<S.length?S[i].title:'Ergebnis';
 if(i==cur)b.className='now';else if(score[i]!==undefined)b.className='done';b.onclick=()=>{cur=i;show()};bar.appendChild(b)}}
function show(){drawBar();card.innerHTML='';
 if(cur==S.length){let p=0,m=0;S.forEach((s,i)=>{if(score[i]){p+=score[i][0];m+=score[i][1]}});const all=S.reduce((a,s,i)=>a+(score[i]?0:1),0);
  card.appendChild(el(`<div><p class="no">Ergebnis</p><h2>Geschafft!</h2><div class="big">${p} / ${m||'–'}</div><p>${all?`Noch ${all} Station(en) nicht geprüft.`:''} ${m&&p/m>=.8?'Sehr gut, das sitzt.':'Schauen Sie sich die roten Stellen noch einmal an und wiederholen Sie die Stationen.'}</p><div class="nav"><button class="primary" onclick="location.reload()">Alles neu starten</button></div></div>`));return}
 const s=S[cur];card.appendChild(el(`<p class="no">Station ${cur+1} von ${S.length}</p>`));card.appendChild(el(`<h2>${s.title}</h2>`));card.appendChild(el(`<div class="task">${s.task}</div>`));
 const box=document.createElement('div');card.appendChild(box);s.render(box);
 const fb=el('<div class="fb"></div>');
 const nav=el('<div class="nav"><button>← Zurück</button><button class="primary">Prüfen</button><button>Weiter →</button></div>');const [b0,b1,b2]=nav.querySelectorAll('button');
 b0.onclick=()=>{if(cur>0){cur--;show()}};b2.onclick=()=>{cur++;show()};
 b1.onclick=()=>{const [p,m,tip]=s.check(box);score[cur]=[p,m];fb.className='fb show '+(p==m?'good':'mid');fb.innerHTML=`<b>${p} von ${m} richtig.</b> ${tip||''}`;drawBar()};
