<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Waschtag</title>
<style>
/* Layout: eine Spalte wie das Bedienfeld einer Waschmaschine; Einstellungen als Tastenreihen, unten großer Start-Knopf */
:root{
  --bg:#E9ECEB;
  --paper:#FFFFFF;
  --ink:#1F2526;
  --muted:#5B6566;
  --line:#C6CDCC;
  --accent:#E0702B;
  --accent-ink:#2B1305;
  --steel:#8B9696;
  --ok:#2F7A4E; --ok-bg:#DDEFE2;
  --bad:#B2442A; --bad-bg:#F6E0DA;
  --f-display:"Arial Black", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-body:Verdana, Arial, system-ui, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px}
.score{font-family:var(--f-display);font-weight:800;font-size:15px;background:var(--ink);color:var(--paper);padding:6px 12px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stations{display:flex;gap:4px;margin-bottom:14px}
.stations span{flex:1;height:8px;border-radius:2px;background:var(--line)}
.stations span.done{background:var(--ink)}
.stations span.now{background:var(--accent)}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:20px 18px;box-shadow:0 5px 0 var(--ink)}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.1;margin:0 0 12px;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:32px} h2{font-size:24px} h3{font-size:17px;margin:16px 0 8px}
p{margin:0 0 12px}
.small{font-size:14px;color:var(--muted)}
.opts{display:grid;gap:10px;margin:14px 0 4px}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt .box{flex:none;width:22px;height:22px;border:2px solid var(--ink);border-radius:50%;margin-top:1px;display:grid;place-items:center;font-size:14px;font-weight:700}
.opt.sel{border-color:var(--ink);background:#FCEBDD}
.opt.sel .box{background:var(--ink);color:var(--paper)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.missed{border-color:var(--ok);border-style:dashed}
.opt[disabled]{cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;border-left:6px solid var(--ink);background:#F2F4F4}
.fb.good{border-left-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.fb b{display:block;margin-bottom:4px}
.btn{display:block;width:100%;margin-top:16px;font-family:var(--f-display);font-weight:800;font-size:19px;background:var(--accent);color:var(--accent-ink);border:2px solid var(--ink);border-radius:999px;padding:14px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--paper);font-size:16px;padding:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
input[type=text]{width:100%;font:inherit;font-size:20px;padding:12px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink)}
.sym{display:flex;justify-content:center;margin:6px 0 4px}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0 6px}
.legend div{display:flex;gap:8px;align-items:center;font-size:14px;line-height:1.25;border:1px solid var(--line);border-radius:10px;padding:8px}
.legend svg{flex:none}
.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.item{font:inherit;font-size:13px;line-height:1.2;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:0;text-align:center}
.item.checked{border-color:var(--ok);background:var(--ok-bg)}
.item.sel{border-color:var(--ink);background:#FCEBDD}
.item .bk{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);min-height:13px}
.item.right{border-color:var(--ok)} .item.wrong{border-color:var(--bad);background:var(--bad-bg)}
.found{font-size:15px;margin:4px 0 0;padding-left:20px}
.baskets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.basket{font:inherit;font-family:var(--f-display);font-weight:800;font-size:14px;overflow-wrap:anywhere;line-height:1.15;border:2px solid var(--ink);border-radius:10px;padding:10px 6px;background:var(--paper);color:var(--ink);cursor:pointer}
.basket small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);margin-top:3px}
.basket[disabled]{opacity:.4;cursor:not-allowed}
.detail{border:1px dashed var(--steel);border-radius:10px;padding:10px;margin:0 0 10px;display:flex;gap:12px;align-items:center;font-size:15px;min-height:76px}
.load{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.load span{display:flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px}
.panel{background:#F4F6F6;border:2px solid var(--ink);border-radius:12px;padding:12px;display:grid;gap:12px}
.row{display:grid;gap:6px}
.row label,.row .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{font:inherit;font-size:15px;font-weight:700;background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;min-width:44px}
.key.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.drawer{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.drawer .key{font-family:var(--f-display);font-size:22px;padding:12px 0}
.drum{width:170px;height:170px;margin:18px auto;border-radius:50%;border:12px solid var(--steel);background:var(--paper);position:relative;overflow:hidden;box-shadow:inset 0 0 0 4px var(--ink)}
.drum::after{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,#c9d6d6 0 25%,transparent 25% 50%,#e4b08f 50% 75%,transparent 75%);border-radius:50%}
.drum.spin::after{animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.res{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.res li{padding:8px 10px;border-radius:8px;font-size:15px;border-left:5px solid var(--ok);background:var(--ok-bg)}
.res li.no{border-left-color:var(--bad);background:var(--bad-bg)}
.res li.info{border-left-color:var(--steel);background:#F2F4F4}
.big{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.how{counter-reset:h;list-style:none;padding:0;margin:0 0 6px;display:grid;gap:8px}
.how li{counter-increment:h;display:flex;gap:10px;align-items:flex-start}
.how li::before{content:counter(h);flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:700;font-size:14px}
.confirm{display:flex;gap:8px}
@media (prefers-reduced-motion:reduce){.drum.spin::after{animation-duration:3s}}
@media (max-width:380px){h1{font-size:28px}h2{font-size:21px}.item{font-size:12px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="2" width="24" height="24" rx="4" fill="none" stroke="#1F2526" stroke-width="2.5"/><circle cx="14" cy="16" r="6.5" fill="none" stroke="#1F2526" stroke-width="2.5"/><circle cx="7" cy="6.5" r="1.4" fill="#E0702B"/></svg>
      Waschtag
    </div>
    <div class="score" id="score">0 Punkte</div>
  </header>
  <div class="stations" id="stations" aria-hidden="true"></div>
  <main class="card" id="card" aria-live="polite"></main>
</div>

<script>
/* ---------- Pflegesymbole ---------- */
function tub({t=null, bars=0, hand=false, cross=false, size=64}={}){
  const w=size, h=size*0.8;
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 60 48" aria-hidden="true">
   <path d="M6 12 Q12 7 18 12 T30 12 T42 12 T54 12" fill="none" stroke="#1F2526" stroke-width="2.5"/>
   <path d="M6 12 L11 38 H49 L54 12" fill="none" stroke="#1F2526" stroke-width="2.5" stroke-linejoin="round"/>`;
  if(t) s+=`<text x="30" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="15" fill="#1F2526">${t}</text>`;
  if(hand) s+=`<path d="M22 34 V22 a2 2 0 0 1 4 0 V28 V19 a2 2 0 0 1 4 0 V28 V20 a2 2 0 0 1 4 0 V29 l3 -4 a2 2 0 0 1 3 2 l-5 8 H24 Z" fill="none" stroke="#1F2526" stroke-width="2" stroke-linejoin="round"/>`;
  for(let b=0;b<bars;b++) s+=`<line x1="11" x2="49" y1="${42+b*4}" y2="${42+b*4}" stroke="#1F2526" stroke-width="2.2"/>`;
  if(cross) s+=`<line x1="8" y1="6" x2="52" y2="42" stroke="#B2442A" stroke-width="3"/><line x1="52" y1="6" x2="8" y2="42" stroke="#B2442A" stroke-width="3"/>`;
  return s+`</svg>`;
}
/* ---------- Wäschestücke ---------- */
const SHAPES={
  shirt:'M8 7 L15 4 Q20 8 25 4 L32 7 L37 15 L31 18 L31 36 L9 36 L9 18 L3 15 Z',
  long:'M9 6 L15 4 Q20 8 25 4 L31 6 L37 33 L32 34 L30 18 L30 36 L10 36 L10 18 L8 34 L3 33 Z',
  jeans:'M10 4 H30 L33 36 H23 L20 15 L17 36 H7 Z',
  sock:'M14 3 H24 V21 Q24 25 28 27 L33 29 Q37 33 33 37 L20 37 Q14 35 14 28 Z',
  towel:'M7 6 H33 V36 H7 Z',
  beanie:'M7 28 Q7 8 20 8 Q33 8 33 28 Z M6 28 H34 V34 H6 Z',
  scarf:'M6 8 H34 V15 H25 V37 H18 V15 H6 Z'
};
function garment(shape,fill,size=40){
  const extra = shape==="towel" ? `<line x1="7" x2="33" y1="12" y2="12" stroke="#1F2526" stroke-width="1.5"/><line x1="7" x2="33" y1="30" y2="30" stroke="#1F2526" stroke-width="1.5"/>`
    : shape==="long" && fill==="#2B2B2B" ? `<path d="M15 4 Q20 13 25 4" fill="none" stroke="#8B9696" stroke-width="1.5"/>` : "";
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" aria-hidden="true"><path d="${SHAPES[shape]}" fill="${fill}" stroke="#1F2526" stroke-width="1.6" stroke-linejoin="round" fill-rule="evenodd"/>${extra}</svg>`;
}
/* cat: weiss | bunt | wolle ; bleed: färbt ab */
const ITEMS=[
  {id:"tw", n:"Weißes T-Shirt", shape:"shirt", fill:"#FFFFFF", cat:"weiss", max:60, mat:"Baumwolle", lab:{t:"60"}},
  {id:"hw", n:"Weißes Handtuch", shape:"towel", fill:"#FFFFFF", cat:"weiss", max:60, mat:"Baumwolle", lab:{t:"60"}},
  {id:"sw", n:"Weiße Socken", shape:"sock", fill:"#FFFFFF", cat:"weiss", max:60, mat:"Baumwolle", lab:{t:"60"}},
  {id:"sr", n:"Rote Socken", shape:"sock", fill:"#C2352B", cat:"bunt", max:40, mat:"Baumwolle", lab:{t:"40"}, bleed:"rosa"},
  {id:"je", n:"Jeans", shape:"jeans", fill:"#33507A", cat:"bunt", max:40, mat:"Baumwolle", lab:{t:"40"}, bleed:"bläulich grau", pocket:["2-Euro-Münze","Taschentuch"]},
  {id:"ho", n:"Schwarzer Hoodie", shape:"long", fill:"#2B2B2B", cat:"bunt", max:30, mat:"Baumwolle", lab:{t:"30"}, bleed:"grau", pocket:["Kaugummi"]},
  {id:"tg", n:"Grünes T-Shirt", shape:"shirt", fill:"#3C8A57", cat:"bunt", max:40, mat:"Baumwolle", lab:{t:"40"}},
  {id:"wp", n:"Wollpullover", shape:"long", fill:"#C9A15C", cat:"wolle", max:30, mat:"100 % Wolle", lab:{t:"30",bars:2}},
  {id:"wm", n:"Wollmütze", shape:"beanie", fill:"#7B4D8C", cat:"wolle", max:40, mat:"Wolle", lab:{hand:true}},
];
const BASKETS={weiss:"Weißwäsche", bunt:"Bunt & Dunkel", wolle:"Wolle & Fein"};
const POCKET_WHY={"2-Euro-Münze":"Münzen können die Trommel oder die Pumpe beschädigen.","Taschentuch":"Ein Taschentuch zerfällt und hinterlässt weiße Fussel auf der ganzen Wäsche.","Kaugummi":"Kaugummi verklebt die Wäsche und geht fast nicht mehr raus."};
const itemById=id=>ITEMS.find(x=>x.id===id);

/* ---------- Ablauf ---------- */
const STATIONS=["Start","Etiketten","Taschen","Sortieren","Waschen","Danach"];
const STEPS=[
  {type:"name", st:0},
  {type:"info", st:0, eyebrow:"So geht's", title:"Der Wäschekorb ist voll.",
   html:`<p>Ihr wohnt in eurer ersten eigenen Wohnung. Mama wäscht nicht mehr, jetzt seid ihr dran. Euer Ziel: Alles wird sauber und <b>nichts geht kaputt</b>.</p>
   <ol class="how"><li>Einer liest laut vor.</li><li>Ihr entscheidet <b>gemeinsam</b>.</li><li>Erst dann tippt ihr auf „Prüfen“ oder „Start“.</li><li>Lest die Erklärungen, sie helfen bei den nächsten Aufgaben.</li></ol>
   <p class="small">Für jede gute Entscheidung gibt es Punkte. Am Ende zeigt ihr euer Ergebnis der Lehrkraft.</p>`},
  {type:"info", st:1, eyebrow:"Station 1 · Etiketten", title:"Erst aufs Etikett schauen",
   html:`<p>In fast jedem Kleidungsstück ist ein kleines Etikett eingenäht. Der <b>Waschbottich</b> sagt euch, wie ihr waschen dürft.</p>
   <div class="legend">
     <div>${tub({t:"60",size:46})}<span>Höchstens <b>60 °C</b></span></div>
     <div>${tub({t:"40",bars:1,size:46})}<span>1 Strich: <b>schonend</b> waschen</span></div>
     <div>${tub({t:"30",bars:2,size:46})}<span>2 Striche: <b>sehr schonend</b> (z. B. Wolle)</span></div>
     <div>${tub({hand:true,size:46})}<span><b>Handwäsche</b> oder Wollprogramm</span></div>
     <div>${tub({cross:true,size:46})}<span><b>Nicht waschen</b></span></div>
   </div>
   <p class="small">Die Zahl ist die höchste erlaubte Temperatur. Kälter waschen geht immer, wärmer nicht.</p>`},
  {type:"single", st:1, eyebrow:"Station 1 · Etiketten", q:"Was bedeutet dieses Zeichen?", sym:{t:"30",bars:2},
   options:[{t:"Höchstens 30 °C, sehr schonend waschen",ok:true},{t:"Zweimal mit 30 °C waschen",ok:false},{t:"Mindestens 30 °C, damit es sauber wird",ok:false}],
   explain:"Die Zahl ist die Höchsttemperatur, die zwei Striche heißen „sehr schonend“. So ein Etikett findet man oft bei Wolle oder empfindlichen Sachen."},
  {type:"single", st:1, eyebrow:"Station 1 · Etiketten", q:"Und dieses?", sym:{cross:true},
   options:[{t:"Nur kalt waschen",ok:false},{t:"Nicht in der Waschmaschine und nicht mit der Hand waschen",ok:true},{t:"Nicht trocknen",ok:false}],
   explain:"Durchgestrichener Bottich heißt: gar nicht waschen. Solche Sachen (z. B. manche Jacken oder Anzüge) kommen in die Reinigung."},
  {type:"single", st:1, eyebrow:"Station 1 · Etiketten", q:"Wie viel Waschmittel kommt in die Maschine?",
   options:[{t:"Viel hilft viel",ok:false},{t:"So viel, wie auf der Packung steht, je nach Wasserhärte und wie schmutzig die Wäsche ist",ok:true},{t:"Ein Schuss nach Gefühl",ok:false}],
   explain:"Zu viel Waschmittel macht die Wäsche nicht sauberer. Es bleibt in der Wäsche hängen, kann die Haut reizen und kostet Geld. Auf der Packung steht eine Tabelle für weiches, mittleres und hartes Wasser."},
  {type:"pockets", st:2},
  {type:"sort", st:3},
  {type:"wash", st:4, cat:"weiss"},
  {type:"wash", st:4, cat:"bunt"},
  {type:"wash", st:4, cat:"wolle"},
  {type:"single", st:5, eyebrow:"Station 5 · Danach", q:"Die Maschine piept: fertig! Was macht ihr?",
   options:[{t:"Gleich ausräumen und aufhängen",ok:true},{t:"Bis morgen drin lassen, das ist ja sauber",ok:false},{t:"Nass in den Wäschekorb und aufs Bett stellen",ok:false}],
   explain:"Nasse Wäsche, die lange in der Trommel liegt, fängt an muffig zu riechen. Dann kann man nochmal waschen."},
  {type:"single", st:5, eyebrow:"Station 5 · Danach", q:"Wie trocknet ihr den Wollpullover?",
   options:[{t:"Auf einen Bügel und an die Heizung",ok:false},{t:"Liegend auf einem Handtuch oder Wäscheständer",ok:true},{t:"Im Trockner auf heiß",ok:false}],
   explain:"Nasse Wolle ist schwer und zieht sich auf dem Bügel lang. Hitze lässt sie einlaufen. Deshalb: flach hinlegen und an der Luft trocknen lassen."},
  {type:"single", st:5, eyebrow:"Station 5 · Danach", q:"Und was macht ihr mit der Waschmaschine?",
   options:[{t:"Tür gleich zumachen, damit kein Staub reinkommt",ok:false},{t:"Tür und Waschmittelfach offen lassen, damit alles trocknet",ok:true},{t:"Nichts, eine Waschmaschine putzt sich selbst",ok:false}],
   explain:"Bleibt die Maschine feucht und zu, bilden sich Schimmel und schlechter Geruch, vor allem in der Gummidichtung an der Tür."},
  {type:"end", st:5}
];

/* ---------- Zustand ---------- */
const fresh=()=>({i:0,pts:0,max:0,group:"",answered:false,pocket:[],sort:{},washed:{}});
let S=fresh();
try{ const sv=JSON.parse(localStorage.getItem("waschtag-spiel")); if(sv && typeof sv.i==="number") S=Object.assign(fresh(),sv); }catch(e){}
function save(){ try{ localStorage.setItem("waschtag-spiel",JSON.stringify(S)); }catch(e){} }
const $card=document.getElementById("card"), $score=document.getElementById("score"), $st=document.getElementById("stations");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function frame(){
  const st=STEPS[S.i].st;
  $st.innerHTML=STATIONS.slice(1).map((_,k)=>`<span class="${k+1<st?'done':k+1===st?'now':''}"></span>`).join("");
  $score.textContent=S.pts+(S.pts===1?" Punkt":" Punkte");
}
function add(p,max){ S.pts+=p; S.max+=max; S.answered=true; save(); frame(); }
function next(){ S.i++; S.answered=false; save(); render(); window.scrollTo({top:0}); }
const ptxt=p=>`+${p} ${p===1?'Punkt':'Punkte'}`;

function render(){
  if(S.answered && STEPS[S.i].type!=="end"){ S.i++; S.answered=false; save(); }
  frame();
  const s=STEPS[S.i];
  ({name:rName,info:rInfo,single:rSingle,pockets:rPockets,sort:rSort,wash:rWash,end:rEnd})[s.type](s);
}

function rName(){
  $card.innerHTML=`<p class="eyebrow">Haushalt · Spiel für 2 bis 3 Personen</p><h1>Waschtag in der ersten Wohnung</h1>
   <p>Etiketten lesen, Taschen leeren, Wäsche sortieren und die Waschmaschine richtig einstellen.</p>
   <button class="btn" id="go">Los geht's</button>`;
  document.getElementById("go").onclick=next;
}
function rInfo(s){
  $card.innerHTML=`<p class="eyebrow">${s.eyebrow}</p><h2>${s.title}</h2>${s.html}<button class="btn" id="nx">Verstanden, weiter</button>`;
  document.getElementById("nx").onclick=next;
}
function rSingle(s){
  $card.innerHTML=`<p class="eyebrow">${s.eyebrow}</p><h2>${s.q}</h2>${s.sym?`<div class="sym">${tub({...s.sym,size:110})}</div>`:""}
   <div class="opts">${s.options.map((o,k)=>`<button class="opt" data-k="${k}"><span class="box"></span><span>${o.t}</span></button>`).join("")}</div>
   <div id="fb"></div><button class="btn" id="chk" disabled>Prüfen</button>`;
  const btns=[...$card.querySelectorAll(".opt")], chk=document.getElementById("chk"); let sel=-1;
  btns.forEach(b=>b.onclick=()=>{ sel=+b.dataset.k; btns.forEach((x,j)=>{x.classList.toggle("sel",j===sel);x.querySelector(".box").textContent=j===sel?"✓":"";}); chk.disabled=false; });
  chk.onclick=()=>{
    if(chk.dataset.done){ next(); return; }
    const ok=s.options[sel].ok;
    btns.forEach((x,j)=>{ x.disabled=true; if(j===sel) x.classList.add(ok?"right":"wrong"); else if(s.options[j].ok) x.classList.add("missed"); });
    add(ok?1:0,1);
    document.getElementById("fb").innerHTML=`<div class="fb ${ok?'good':'bad'}"><b>${ok?'Richtig!':'Nicht ganz.'} ${ptxt(ok?1:0)}</b>${s.explain}</div>`;
    chk.textContent="Weiter"; chk.dataset.done=1;
  };
}

/* Station 2: Taschen leeren */
function rPockets(){
  const total=ITEMS.reduce((a,x)=>a+(x.pocket?x.pocket.length:0),0);
  $card.innerHTML=`<p class="eyebrow">Station 2 · Taschen leeren</p><h2>Erst mal alle Taschen checken!</h2>
   <p>Tippt jedes Wäschestück an und schaut, ob noch etwas drin ist.</p>
   <div class="items">${ITEMS.map(x=>`<button class="item" data-id="${x.id}">${garment(x.shape,x.fill)}<span>${x.n}</span></button>`).join("")}</div>
   <div id="fb"><p class="small" id="cnt">Noch 9 Teile zu prüfen.</p></div>
   <button class="btn" id="nx" disabled>Weiter</button>`;
  const seen=new Set(); const finds=[];
  const btns=[...$card.querySelectorAll(".item")], nx=document.getElementById("nx");
  btns.forEach(b=>b.onclick=()=>{
    const it=itemById(b.dataset.id); if(seen.has(it.id)) return; seen.add(it.id); b.classList.add("checked");
    (it.pocket||[]).forEach(f=>finds.push({f,where:it.n}));
    const left=ITEMS.length-seen.size;
    document.getElementById("fb").innerHTML=
      (finds.length?`<div class="fb good"><b>Gefunden: ${finds.length} von ${total}</b><ul class="found">${finds.map(x=>`<li>${x.f} (${x.where}). ${POCKET_WHY[x.f]}</li>`).join("")}</ul></div>`:"")+
      `<p class="small" style="margin-top:10px">${left?`Noch ${left} ${left===1?'Teil':'Teile'} zu prüfen.`:'Alles geprüft!'}</p>`;
    if(!left){ nx.disabled=false; }
  });
  nx.onclick=()=>{ add(total,total); next(); };
}

/* Station 3: Sortieren */
function rSort(){
  $card.innerHTML=`<p class="eyebrow">Station 3 · Sortieren</p><h2>Welche Wäsche kommt zusammen?</h2>
   <p>Tippt ein Teil an, schaut aufs Etikett und wählt dann den Wäschekorb.</p>
   <div class="detail" id="det"><span class="small">Noch kein Teil ausgewählt.</span></div>
   <div class="baskets">${Object.entries(BASKETS).map(([k,v])=>`<button class="basket" data-b="${k}" disabled>${v}<small>${k==='weiss'?'Weißes und Helles':k==='bunt'?'Farbiges und Schwarzes':'Wolle und Empfindliches'}</small></button>`).join("")}</div>
   <div class="items">${ITEMS.map(x=>`<button class="item" data-id="${x.id}">${garment(x.shape,x.fill)}<span>${x.n}</span><span class="bk"></span></button>`).join("")}</div>
   <div id="fb"></div><button class="btn" id="chk" disabled>Prüfen</button>`;
  let cur=null; const as={};
  const items=[...$card.querySelectorAll(".item")], bas=[...$card.querySelectorAll(".basket")], chk=document.getElementById("chk"), det=document.getElementById("det");
  const short={weiss:"Weiß",bunt:"Bunt",wolle:"Wolle"};
  items.forEach(b=>b.onclick=()=>{
    if(chk.dataset.done) return;
    cur=b.dataset.id; const it=itemById(cur);
    items.forEach(x=>x.classList.toggle("sel",x===b));
    det.innerHTML=`${tub({...it.lab,size:64})}<div><b>${it.n}</b><br><span class="small">Material: ${it.mat}</span></div>`;
    bas.forEach(x=>x.disabled=false);
  });
  bas.forEach(b=>b.onclick=()=>{
    if(!cur) return; as[cur]=b.dataset.b;
    const el=items.find(x=>x.dataset.id===cur); el.querySelector(".bk").textContent=short[b.dataset.b]; el.classList.remove("sel");
    cur=null; bas.forEach(x=>x.disabled=true); det.innerHTML=`<span class="small">${Object.keys(as).length} von ${ITEMS.length} einsortiert.</span>`;
    chk.disabled=Object.keys(as).length<ITEMS.length;
  });
  chk.onclick=()=>{
    if(chk.dataset.done){ next(); return; }
    let p=0; const wrong=[];
    items.forEach(x=>{ const it=itemById(x.dataset.id); const ok=as[it.id]===it.cat; x.classList.add(ok?"right":"wrong"); if(ok)p++; else wrong.push(it); });
    S.sort=as; add(p,ITEMS.length);
    document.getElementById("fb").innerHTML=`<div class="fb ${wrong.length?'bad':'good'}"><b>${p} von ${ITEMS.length} richtig. ${ptxt(p)}</b>
     ${wrong.length?`Falsch einsortiert: ${wrong.map(w=>w.n).join(", ")}. Ihr wascht jetzt trotzdem so, wie ihr sortiert habt. Mal sehen, was passiert ...`:"Perfekt sortiert! Weiß zu Weiß, Farbiges zu Farbigem und Wolle extra."}
     <br><br>Merke: Neue und dunkle Sachen können abfärben. Wolle braucht ein eigenes Programm.</div>`;
    chk.textContent="Weiter zur Waschmaschine"; chk.dataset.done=1;
  };
}

/* Station 4: Waschmaschine */
const OPT={
  prog:[["baum","Baumwolle"],["pfl","Pflegeleicht"],["wolle","Wolle / Hand"]],
  temp:[[20,"kalt"],[30,"30°"],[40,"40°"],[60,"60°"],[90,"90°"]],
  mittel:[["voll","Vollwaschmittel"],["color","Colorwaschmittel"],["fein","Fein- / Wollwaschmittel"]],
  fach:[["I","I"],["II","II"],["blume","✿"]],
  menge:[["voll","randvoll gestopft"],["hand","eine Hand breit Platz"],["halb","halb voll"]],
  spin:[[400,"400"],[800,"800"],[1200,"1200"],[1600,"1600"]]
};
function rWash(s){
  const load=ITEMS.filter(x=>S.sort[x.id]===s.cat);
  if(!load.length){ S.i++; save(); render(); return; }
  const nr=["weiss","bunt","wolle"].filter(c=>ITEMS.some(x=>S.sort[x.id]===c)).indexOf(s.cat)+1;
  $card.innerHTML=`<p class="eyebrow">Station 4 · Waschen · Ladung ${nr}</p><h2>${BASKETS[s.cat]}</h2>
   <div class="load">${load.map(x=>`<span>${garment(x.shape,x.fill,24)} ${x.n} ${tub({...x.lab,size:30})}</span>`).join("")}</div>
   <p class="small">Tipp: Bei gemischter Wäsche zählt das empfindlichste Etikett.</p>
   <div class="panel">
     ${row("prog","Programm")}${row("temp","Temperatur")}${row("spin","Schleudern (Umdrehungen pro Minute)")}
     ${row("mittel","Waschmittel")}
     <div class="row"><span class="lab">In welches Fach kommt das Waschmittel?</span><div class="drawer keys" data-r="fach">${OPT.fach.map(([v,t])=>`<button class="key" data-v="${v}">${t}</button>`).join("")}</div>
       <span class="small">Bei den meisten Maschinen: I = Vorwäsche, II = Hauptwäsche, ✿ = Weichspüler.</span></div>
     ${row("menge","Wie voll ist die Trommel?")}
   </div>
   <div id="out"></div><button class="btn" id="go" disabled>Start</button>`;
  function row(k,l){ return `<div class="row"><span class="lab">${l}</span><div class="keys" data-r="${k}">${OPT[k].map(([v,t])=>`<button class="key" data-v="${v}">${t}</button>`).join("")}</div></div>`; }
  const set={}; const go=document.getElementById("go");
  $card.querySelectorAll(".keys").forEach(r=>{
    const k=r.dataset.r;
    r.querySelectorAll(".key").forEach(b=>b.onclick=()=>{
      if(go.dataset.done) return;
      set[k]=isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v;
      r.querySelectorAll(".key").forEach(x=>x.classList.toggle("on",x===b));
      go.disabled=Object.keys(set).length<6;
    });
  });
  go.onclick=()=>{
    if(go.dataset.done){ next(); return; }
    go.disabled=true; $card.querySelectorAll(".key").forEach(x=>x.disabled=true);
    document.getElementById("out").innerHTML=`<div class="drum spin" id="drum" role="img" aria-label="Die Trommel dreht sich"></div><p class="small" style="text-align:center">Die Maschine wäscht ...</p>`;
    setTimeout(()=>{
      const r=evaluate(load,set); add(r.p,6);
      document.getElementById("out").innerHTML=`<div class="fb ${r.p>=5?'good':'bad'}"><b>${r.head} ${ptxt(r.p)} (von 6)</b></div><ul class="res">${r.lines.map(l=>`<li class="${l[0]===true?'':l[0]===false?'no':'info'}">${l[1]}</li>`).join("")}</ul>`;
      go.disabled=false; go.textContent="Weiter"; go.dataset.done=1;
    },2600);
  };
}
function evaluate(load,c){
  const L=[]; let p=0, damage=0;
  const wool=load.filter(x=>x.cat==="wolle"), color=load.filter(x=>x.cat==="bunt"), white=load.filter(x=>x.cat==="weiss");
  const minT=Math.min(...load.map(x=>x.max));
  // Programm
  const needProg = wool.length ? "wolle" : "baum";
  if(c.prog===needProg){ p++; L.push([true, needProg==="wolle"?"Wollprogramm: richtig, Wolle braucht wenig Bewegung.":"Baumwolle: richtig für T-Shirts, Handtücher, Jeans und Hoodies."]); }
  else if(needProg==="wolle"){ L.push([false,"Wolle im normalen Programm: Durch die viele Bewegung verfilzt sie und läuft ein."]); damage++; }
  else if(c.prog==="pfl"){ L.push([false,"Pflegeleicht ist eigentlich für Kunstfasern wie Polyester. Für Baumwolle nehmt ihr das Baumwollprogramm."]); }
  else { L.push([false,"Das Wollprogramm wäscht sehr sanft. Für Baumwolle ist das zu wenig, sie wird nicht richtig sauber."]); }
  // Temperatur
  const hot=load.filter(x=>c.temp>x.max);
  if(hot.length){
    hot.forEach(x=>{ damage++; L.push([false, x.cat==="wolle" ? `${x.n} mit ${c.temp} °C: eingelaufen und verfilzt! Passt jetzt höchstens noch einem Kind.` : `${x.n}: Das Etikett erlaubt nur ${x.max} °C. Zu heiß gewaschen kann es einlaufen oder ausbleichen.`]); });
  } else if(c.temp===minT || (minT<=30 && c.temp>=minT-10 && !white.length)){
    p++; L.push([true,`${c.temp===20?"Kalt":c.temp+" °C"}: passt zu allen Etiketten in dieser Ladung.`]);
  } else {
    L.push([false, white.length && minT===60 ? `${c.temp===20?"Kalt":c.temp+" °C"} ist für Handtücher und Socken zu kühl. Die wäscht man besser mit 60 °C, damit Keime und Gerüche weggehen.` : `Kälter als nötig: spart Strom, aber die Wäsche wird vielleicht nicht ganz sauber. Hier wären ${minT} °C möglich.`]);
  }
  // Schleudern
  if(wool.length){ if(c.spin<=800){p++;L.push([true,`${c.spin} Umdrehungen: schön sanft für die Wolle.`]);} else {L.push([false,`${c.spin} Umdrehungen sind zu viel für Wolle. Sie kann sich verziehen und verfilzen.`]);} }
  else if(c.spin===800||c.spin===1200){ p++; L.push([true,`${c.spin} Umdrehungen: gut, die Wäsche ist nicht mehr tropfnass.`]); }
  else if(c.spin===400){ L.push([false,"Nur 400 Umdrehungen: Die Wäsche ist noch sehr nass und braucht ewig zum Trocknen."]); }
  else { L.push([false,"1600 Umdrehungen: Die Wäsche ist sehr zerknittert. Für normale Wäsche reichen 800 bis 1200."]); }
  // Waschmittel
  const needM = wool.length ? "fein" : color.length ? "color" : "voll";
  if(c.mittel===needM){ p++; L.push([true, {fein:"Fein- oder Wollwaschmittel: genau richtig für Wolle.",color:"Colorwaschmittel: Es hat keine Bleiche, die Farben bleiben schön.",voll:"Vollwaschmittel: Mit Bleiche bleibt Weißes richtig weiß."}[needM]]); }
  else if(needM==="fein"){ L.push([false,"Voll- und Colorwaschmittel enthalten Stoffe, die Wolle angreifen können. Für Wolle nehmt ihr Woll- oder Feinwaschmittel."]); }
  else if(needM==="color" && c.mittel==="voll"){ L.push([false,"Vollwaschmittel hat Bleiche. Die bleicht bunte und schwarze Sachen mit der Zeit aus."]); }
  else if(needM==="voll" && c.mittel==="color"){ L.push([false,"Colorwaschmittel geht, aber ohne Bleiche wird weiße Wäsche mit der Zeit grau. Für Weißes ist Vollwaschmittel besser."]); }
  else { L.push([false,"Feinwaschmittel ist für empfindliche Sachen. Normale Wäsche wird damit nicht so gut sauber."]); }
  // Fach
  if(c.fach==="II"){ p++; L.push([true,"Fach II (Hauptwäsche): richtig."]); }
  else if(c.fach==="I"){ L.push([false,"Fach I ist für die Vorwäsche. Ohne Vorwäsche bleibt das Waschmittel dort einfach liegen und die Wäsche wird nicht richtig sauber."]); }
  else { L.push([false,"Das Blumen-Fach ist für Weichspüler. Das Waschmittel wird erst am Ende eingespült, die Wäsche wird nicht sauber."]); }
  // Beladung
  if(c.menge==="hand" || (c.menge==="halb" && wool.length)){ p++; L.push([true, c.menge==="hand"?"Eine Hand breit Platz: perfekt, die Wäsche kann sich bewegen.":"Halb voll: richtig, Wolle braucht viel Platz."]); }
  else if(c.menge==="voll"){ L.push([false,"Randvoll: Die Wäsche kann sich nicht bewegen und wird nicht sauber. Oben sollte eine Hand breit Platz bleiben."]); }
  else { L.push([false,"Halb voll: verschwendet Wasser und Strom. Lieber warten, bis eine Hand breit Platz übrig ist."]); }
  // Falsch sortiert: Abfärben
  const bleeders=color.filter(x=>x.bleed);
  if(white.length && bleeders.length){ damage++; L.unshift([false,`Oh nein! ${bleeders.map(x=>x.n).join(" und ")} ${bleeders.length>1?'haben':'hat'} abgefärbt. Die weiße Wäsche ist jetzt ${bleeders[0].bleed}.`]); }
  else if(white.length && color.length){ L.unshift(["info","Weißes zusammen mit Farbigem wird mit der Zeit grau. Besser trennen."]); }
  if(wool.length && (color.length || white.length)) L.unshift(["info","Baumwolle in der Wollwäsche wird im sanften Wollprogramm nicht richtig sauber."]);
  const head = damage ? "Da ist was schiefgegangen." : p>=5 ? "Sauber und nichts kaputt!" : "Nichts kaputt, aber es geht besser.";
  return {p,lines:L,head};
}

function rEnd(){
  const r=S.max?S.pts/S.max:0;
  const title=r>=.85?"Waschprofis":r>=.6?"Fast schon Profis":r>=.35?"Rosa-Socken-Gefahr":"Lieber nochmal zu Mama";
  $card.innerHTML=`<p class="eyebrow">Geschafft</p><h1>Alles im Schrank!</h1>
   <div class="big">${S.pts} / ${S.max}</div><p><b>Euer Titel: ${title}</b></p>
   <p>Zeigt dieses Ergebnis jetzt eurer Lehrkraft.</p>
   <h3>Die wichtigsten Regeln</h3>
   <ul class="res">
     <li class="info">Taschen leeren, Reißverschlüsse zu</li>
     <li class="info">Etikett lesen: Die Zahl ist die höchste Temperatur</li>
     <li class="info">Sortieren: Weiß, Bunt und Dunkel, Wolle und Fein</li>
     <li class="info">Weißes: Vollwaschmittel. Buntes: Colorwaschmittel. Wolle: Woll- oder Feinwaschmittel</li>
     <li class="info">Waschmittel nach Packung dosieren, meistens in Fach II</li>
     <li class="info">Eine Hand breit Platz in der Trommel lassen</li>
     <li class="info">Gleich aufhängen, Tür offen lassen</li>
   </ul>
   <div id="rs"><button class="btn ghost" id="again">Neues Spiel</button></div>`;
  document.getElementById("again").onclick=()=>{
    document.getElementById("rs").innerHTML=`<p class="small" style="margin-top:14px">Wirklich neu starten? Euer Ergebnis wird gelöscht.</p><div class="confirm"><button class="btn ghost" id="no">Abbrechen</button><button class="btn" id="yes">Neu starten</button></div>`;
    document.getElementById("no").onclick=rEnd;
    document.getElementById("yes").onclick=()=>{ S=fresh(); save(); render(); };
  };
}
if(S.i>=STEPS.length) S=fresh();
render();
</script>
